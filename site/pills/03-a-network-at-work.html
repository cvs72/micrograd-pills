  const recipes = [1, 2, 3].map(l => label('#c084fc', anchor(COLS[l].x, -topOf(COLS[l]) - 1.0), 'tag', 30));
  mids.forEach(L => say(L, '× weights, one per wire')); recipes.forEach(L => say(L, 'add · + bias · squash'));

  // ---------- show a sample: picture tints, labels, activations, scores ----------
  let cur = { k: 0, r: null };
  function setSample(k, trained, lit) {
    const s = NET.samples[k]; cur = { k, r: forward(s.pixels) };
    const probs = trained ? cur.r.p : s.untrained;
    picture.forEach((t, i) => { tint(t, s.pixels[i] / 16); say(pxLabels[i], String(s.pixels[i])); pxLabels[i].el.style.setProperty('--hue', s.pixels[i] > 7 ? '#0b1020' : '#8e99bd'); });
    inputs.forEach((n, i) => { n.userData.v = s.pixels[i] / 16; tint(n, n.userData.v); if (!lit) n.material.emissiveIntensity = 0.15; });
    nodes[0].forEach((n, i) => { n.material.emissiveIntensity = lit && trained ? 0.1 + 0.9 * Math.abs(cur.r.h1[i]) : 0.1; });
    nodes[1].forEach((n, i) => { n.material.emissiveIntensity = lit && trained ? 0.1 + 0.9 * Math.abs(cur.r.h2[i]) : 0.1; });
    const win = probs.indexOf(Math.max(...probs));
    nodes[2].forEach((n, i) => { const bad = i === win && i !== s.label && trained; n.material.color.setHex(bad ? C.bad : C.output); n.material.emissive.copy(n.material.color); n.material.emissiveIntensity = lit ? 0.15 + 1.0 * probs[i] : 0.1; });
    bars.forEach((b, i) => { b.scale.x = Math.max(0.01, probs[i] * BAR_LEN); b.position.x = BAR_X + b.scale.x / 2; const bad = i === win && i !== s.label && trained; b.material.color.setHex(bad ? C.bad : C.output); b.material.emissive.copy(b.material.color); b.material.emissiveIntensity = i === win ? 0.6 : 0.15; });
    scoreLabels.forEach((L, i) => { say(L, `<b>${i}</b>${pct(probs[i])}${i === s.label ? ' ✓' : ''}`); L.el.style.setProperty('--hue', i === win && i !== s.label && trained ? '#fb7185' : i === win ? '#5eead4' : '#8e99bd'); });
    setStrengths(cur.r);
    return probs;
  }

  // ---------- tiny tween engine ----------

  // light travels along every wire of transition l: to the middle (pause there if asked, with the "× weights" label), then into the neurons,
  // which light up by their value while the recipe label appears under them. Returns the time it ends.
  function sweep(l, t0, pause, dur) {
    const S = signalSets[l], dest = nodes[l], vals = [cur.r.h1, cur.r.h2, cur.r.p][l];
    later(() => { setSignal(S, 0); showSignal(S, true, 0.9); state(mids[l], ''); state(recipes[l], ''); }, t0);
    anim(t => setSignal(S, 0.5 * t), dur / 2, t0, linear);
    const t1 = t0 + dur / 2 + pause;
    if (pause > 0) later(() => state(mids[l], 'on'), t0 + dur / 2 + 0.1);
    anim(t => setSignal(S, 0.5 + 0.5 * t), dur / 2, t1, linear);
    const t2 = t1 + dur / 2;
    dest.forEach((n, i) => glow(n, l === 2 ? 0.15 + 1.0 * vals[i] : 0.1 + 0.9 * Math.abs(vals[i]), 0.5, t2));
    later(() => { state(recipes[l], 'on'); if (pause > 0) state(mids[l], 'dim'); }, t2 + 0.1);
    anim(t => showSignal(S, true, lerp(0.9, 0.3, t)), 0.8, t2 + 0.8);
    return t2 + 0.8;
  }
  // the whole forward pass of the current sample
  function flow(t0, slow) {
    const probs = cur.r.p;
    inputs.forEach(n => anim(t => { n.material.emissiveIntensity = lerp(0.15, 0.25 + 0.5 * n.userData.v, t); }, 0.6, t0));
    let t = sweep(0, t0 + 0.6, slow ? 1.4 : 0, slow ? 2.4 : 1.6);
    t = sweep(1, t + 0.2, 0, slow ? 2.0 : 1.4);
    t = sweep(2, t + 0.2, 0, slow ? 1.8 : 1.2);
    bars.forEach((b, i) => { const to = Math.max(0.01, probs[i] * BAR_LEN); anim(tt => { b.visible = true; b.scale.x = lerp(0.01, to, tt); b.position.x = BAR_X + b.scale.x / 2; }, 0.8, t); });
    later(() => scoreLabels.forEach(L => state(L, 'on')), t + 0.4);
    return t + 1.2;
  }
  function resetSignals() { signalSets.forEach(S => showSignal(S, false, 0)); mids.forEach(L => state(L, '')); recipes.forEach(L => state(L, '')); }

  // ---------- the steps ----------
  const FULL = [-14.2, 19.6, -topOf(COLS[0]) - 2.2, HY + 0.9], OUT = [1.6, 19.6, -topOf(COLS[0]) - 2.2, HY + 0.9];
  const steps = [
    { dur: 14, title: 'A network with a job', box: [-20.2, -10.2, -5.4, 5.6], yaw: -0.1,
      text: 'One of the first jobs a neural network did for money, from 1989: reading handwritten digits on postcodes and cheques. This is a simplified version of that network, with a real picture from the same kind of data. The job is small and clear: look at the picture, say which digit it is.',
      line: 'job: read a handwritten digit' },
    { dur: 16, title: 'A picture is numbers', box: [-20.2, -4.6, -topOf(COLS[0]) - 1.2, HY + 0.9], yaw: -0.06,
      text: 'To a network a picture is a list of numbers: one per pixel, how bright it is, here from 0 to 16. Eight by eight pixels, 64 numbers. Those are the inputs, the numbers in from the previous pill. No weights yet: this is only the raw data being lined up.',
      line: '<span class="i">64 pixels → 64 numbers</span>, 0 to 16' },
    { dur: 16, title: 'The rows', box: FULL, yaw: 0,
      text: 'Three rows of neurons: 32, then 16, then 10. Every neuron does the recipe from the previous pill on every number from the row before. The rows get shorter because the network squeezes 64 numbers down to ten answers. The last row has exactly ten neurons because there are ten possible digits.',
      line: '64 → 32 → 16 → 10 · <span class="k">2,778 weights and biases</span>' },
    { dur: 28, title: 'The forward pass', box: FULL, yaw: 0.04,
      text: 'Feed the 64 numbers in and let them flow. On every wire the number is multiplied by that wire’s weight: bright wires carry a lot, dark wires almost nothing, and a dark pixel sends nothing at all. Inside each neuron the arrivals are added, the bias is added, the total is squashed, and one number leaves for the next row. This is the forward pass: just the calculation, done once.',
      line: '<span class="s">forward pass</span>: × weight on the wire · add, + bias, squash in the neuron' },
    { dur: 14, title: 'Ten scores', box: OUT, yaw: 0.1,
      text: 'The ten outputs are scores, one per digit, adding up to 100%. The biggest is the network’s answer. Here it says 3, and it is right. These scores are real: this network was trained on 3,823 pictures with the same recipe the later pills explain, then shown pictures it had never seen.',
      line: null },
    { dur: 24, title: 'Another picture, and a mistake', box: FULL, yaw: 0,
      text: 'A different picture, the same 2,778 numbers inside, a different answer out: nothing inside changed, only the inputs did. And it can be wrong. The third picture is a 7, and the network says 9, very confidently. On 1,797 unseen pictures it gets 1,724 right, about 96 out of 100.',
      line: null },
    { dur: 16, title: 'Where the knowledge lives', box: OUT, yaw: 0.1,
      text: 'Everything this network knows is in its 2,778 weights and biases. Before training they were random numbers, and the scores for the same 3 were noise: every digit near 10%. Training nudged every one of those numbers, a little at a time, until the right score came out. How that nudging works is the rest of this series.',
      line: null }
  ];
  const s0 = NET.samples[0];
  steps[4].line = `scores: <span class="o">3 wins, ${pct(forward(s0.pixels).p[3])}</span>`;
  steps[5].line = `8: <span class="o">${pct(forward(NET.samples[1].pixels).p[8])}</span> ✓ · 7 read as <span class="x">9, ${pct(forward(NET.samples[2].pixels).p[9])}</span> ✗ · ${NET.test_right.toLocaleString('en')} of ${NET.n_test.toLocaleString('en')} right`;
  steps[6].line = `before training: every score ≈ 10% (${s0.untrained.map(v => Math.round(v * 100) + '%').join(' ')})`;

  // deterministic resting state at the start of step i
  function baseState(i) {
    clearAnims();
    const k = i === 5 ? 2 : 0, trained = i !== 6, lit = i >= 3;
    setSample(k, trained, lit);
    picture.forEach(t => { t.visible = true; t.material.opacity = 1; });
    if (i >= 2) { pic.position.x = PIC.parkedX; pic.scale.setScalar(PIC.parkedScale); } else { pic.position.x = PIC.x; pic.scale.setScalar(1); }
    inputs.forEach((n, j) => { if (i >= 1) { n.position.copy(posIn(COLS[0], j)); n.scale.setScalar(COLS[0].pitch); n.visible = true; } else n.visible = false; n.material.opacity = 1; });
    pxLabels.forEach(L => state(L, i === 1 ? 'on' : ''));
    const rows = i >= 2;
    nodes.forEach(row => row.forEach(n => { n.visible = rows; n.material.opacity = 1; n.scale.setScalar(1); }));
    wireSets.forEach(ws => { ws.visible = rows; ws.material.opacity = rows ? 0.14 : 0; });
    signalSets.forEach(S => { if (lit) { setSignal(S, 1); showSignal(S, true, 0.3); } else showSignal(S, false, 0); });
    mids.forEach(L => state(L, '')); recipes.forEach(L => state(L, lit && i <= 3 ? 'dim' : ''));
    bars.forEach(b => { b.visible = i >= 4; });
    scoreLabels.forEach(L => state(L, i >= 4 ? 'on' : ''));
    state(heads.pic, i <= 1 ? 'on' : ''); state(heads.inp, i >= 1 ? (i === 1 ? 'on' : 'dim') : ''); state(heads.h1, rows ? (i === 2 ? 'on' : 'dim') : ''); state(heads.h2, rows ? (i === 2 ? 'on' : 'dim') : ''); state(heads.out, rows ? (i === 2 || i === 4 ? 'on' : 'dim') : '');
    say(heads.note, i === 6 ? 'before training · random weights' : i === 5 ? 'picture 3 of 3 · a 7' : ''); state(heads.note, i === 5 || i === 6 ? 'on' : '');
  }

  const enter = [
    () => { picture.forEach((t, j) => { t.material.opacity = 0; fade(t, 1, 0.5, 0.2 + Math.floor(j / 8) * 0.12); }); state(heads.pic, ''); later(() => state(heads.pic, 'on'), 1.4); },
    () => { // the numbers appear on the picture, then a copy of every pixel flies into the column of 64 inputs, row by row
      pxLabels.forEach((L, j) => { state(L, ''); later(() => state(L, 'on'), 0.3 + Math.floor(j / 8) * 0.12); });
      inputs.forEach((n, j) => { n.visible = true; const from = picture[j].getWorldPosition(new THREE.Vector3()), to = posIn(COLS[0], j); n.position.copy(from); n.scale.setScalar(1);
        anim(t => { n.position.lerpVectors(from, to, t); n.scale.setScalar(lerp(1, COLS[0].pitch, t)); }, 1.1, 1.8 + Math.floor(j / 8) * 0.28, easeInOut); });
      state(heads.inp, ''); later(() => state(heads.inp, 'on'), 4.4);
    },
    () => { // the picture parks small on the left; the rows grow in, left to right, then the wires
      pic.position.x = PIC.x; pic.scale.setScalar(1); anim(t => { pic.position.x = lerp(PIC.x, PIC.parkedX, t); pic.scale.setScalar(lerp(1, PIC.parkedScale, t)); }, 1.0, 0.1, easeInOut);
      nodes.forEach((row, l) => row.forEach((n, j) => { n.scale.setScalar(0.01); n.material.opacity = 0; anim(t => { n.scale.setScalar(0.01 + 0.99 * t); n.material.opacity = t; }, 0.6, 0.8 + l * 0.9 + j * 0.03); }));
      wireSets.forEach((ws, l) => { ws.material.opacity = 0; ws.visible = true; anim(t => { ws.material.opacity = 0.14 * t; }, 0.8, 1.7 + l * 0.9); });
      [heads.h1, heads.h2, heads.out].forEach((L, l) => { state(L, ''); later(() => state(L, 'on'), 1.4 + l * 0.9); });
    },
    () => { setSample(0, true, false); resetSignals(); bars.forEach(b => { b.visible = false; }); scoreLabels.forEach(L => state(L, '')); flow(0.6, true); },
    () => { bars.forEach(b => { const to = b.scale.x; b.scale.x = 0.01; anim(t => { b.scale.x = lerp(0.01, to, t); b.position.x = BAR_X + b.scale.x / 2; }, 0.9, 0.4); }); scoreLabels.forEach(L => state(L, '')); later(() => scoreLabels.forEach(L => state(L, 'on')), 1.1); },
    () => { // the 8 flows through, then the 7 that is read as a 9
      const run = (k, t0, note) => later(() => { setSample(k, true, false); resetSignals(); bars.forEach(b => { b.visible = false; }); scoreLabels.forEach(L => state(L, '')); say(heads.note, note); state(heads.note, 'on'); flow(0.2, false); }, t0);
      say(heads.note, ''); state(heads.note, '');
      run(1, 0.4, 'picture 2 of 3 · an 8');
      run(2, 11.5, 'picture 3 of 3 · a 7');
    },
    () => { // the same 3 through the untrained weights: the bars collapse to noise
      setSample(0, true, true); const trainedP = cur.r.p.slice();
      state(heads.note, ''); later(() => { setSample(0, false, true); state(heads.note, 'on'); }, 1.2);
      bars.forEach((b, i) => { const from = trainedP[i] * BAR_LEN, to = Math.max(0.01, s0.untrained[i] * BAR_LEN); anim(t => { b.scale.x = lerp(from, to, t); b.position.x = BAR_X + b.scale.x / 2; }, 1.2, 1.2, easeInOut); });
    }
  ];

  // ---------- ledger: the network so far, every line stays ----------
  const ledgerEl = document.getElementById('ledger');
  function renderLedger(i) {
    ledgerEl.innerHTML = '<div class="ln title">the network so far</div>';
    for (let k = 0; k <= i; k++) { if (!steps[k].line) continue; const d = document.createElement('div'); d.className = 'ln' + (k === i ? ' now' : ''); d.innerHTML = steps[k].line; ledgerEl.appendChild(d); }
  }

  // ---------- camera ----------

  K.run({ steps, enter, baseState, ledger: renderLedger });
})();
</script>
</body>
</html>
