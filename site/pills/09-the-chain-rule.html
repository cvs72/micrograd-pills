    pixRing.visible = true; pixRing.material.color.setHex(i === 0 || i === 1 || i === 4 ? C.knob : C.dim);
    vis(T.knob1, true, i === 0 || i === 1 || i === 4, C.knob); T.fan10.forEach(t => vis(t, true, i === 0, C.signal)); T.fan2.forEach(t => vis(t, true, i === 0, C.signal)); T.toLoss.forEach(t => vis(t, true, i === 0, C.signal));
    PT.show(i >= 1 ? 1 : 0); L.s.geometry.setDrawRange(0, i >= 1 ? 121 : 0); L.s.material.color.setHex(i === 1 ? C.signal : C.dim); tanAt(1); L.tan.visible = i >= 1; L.tan.material.color.setHex(i === 1 ? C.knob : C.dim); dotT.visible = i >= 1;
    if (PT.g.visible) { state(PT.xName, i === 1 ? 'on' : 'dim'); state(PT.yName, i === 1 ? 'on' : 'dim'); }
    dimOn(tl.step1, i >= 1, i === 1); dimOn(tl.tan, i >= 1, i === 1);
    vis(T.knobA, i >= 2, i === 2, C.knob); vis(T.score7, i >= 2, i === 2, C.bad); dimOn(tl.last, i >= 2, i === 2); dimOn(tl.score7, i >= 2, i === 2); dimOn(tl.inA, i >= 2, i === 2);
    PB.show(i >= 3 ? 1 : 0); if (PB.g.visible) { state(PB.xName, i === 3 ? 'on' : 'dim'); state(PB.yName, i === 3 ? 'on' : 'dim'); }
    bars.forEach(b => { if (i >= 3) { setBar(b, 1); b.material.color.setHex(i === 3 ? (b.userData.v > 0 ? C.bad : C.output) : C.dim); b.material.emissive.copy(b.material.color); } else b.visible = false; });
    T.fan14.forEach(t => vis(t, i >= 3, i === 3, C.signal)); vis(T.knobB, i >= 3, i === 3, C.knob); ring14.visible = i >= 3; ring14.material.color.setHex(i === 3 ? C.signal : C.dim);
    dimOn(tl.big, i >= 3, i === 3); dimOn(tl.ring14, i >= 3, i === 3); dimOn(tl.inB, i >= 3, i === 3);
    blameRows(i >= 4 ? 3 : 0); for (const k of ['bl7', 'bl9', 'bl14', 'bl10', 'chain', 'blame']) dimOn(tl[k], i >= 4, i === 4);
    vis(T.fwd, i >= 5, i === 5, C.output); vis(T.bwd, i >= 5, i === 5, C.bad); fwdHead.visible = i >= 5; bwdHead.visible = i >= 5; dimOn(tl.fwd, i >= 5, i === 5); dimOn(tl.bwd, i >= 5, i === 5);
  }

  const enter = [
    () => { for (const k of ['loss', 'pixel', 'neuron', 'nudged', 'paths']) state(tl[k], ''); pixRing.visible = false; T.knob1.visible = false; for (const t of [...T.fan10, ...T.fan2, ...T.toLoss]) t.visible = false;
      on(tl.loss, 1.0); pulse(lossNode, 0.8, 1.0); later(() => { pixRing.visible = true; pulse(pixRing, 0.8, 0); state(tl.pixel, 'on'); }, 2.6);
      growT(T.knob1, 1.0, 3.6); on(tl.neuron, 4.4); growAll(T.fan10, 0.8, 5.6, 0.04); growAll(T.fan2, 0.9, 7.0, 0.004); growAll(T.toLoss, 0.8, 8.6, 0.05); on(tl.paths, 9.6); on(tl.nudged, 12.0); },
    () => { PT.show(0); anim(a => PT.show(a), 0.9, 0.4); L.s.geometry.setDrawRange(0, 0); L.tan.visible = false; dotT.visible = false; state(tl.step1, ''); state(tl.tan, '');
      later(() => { pulse(T.knob1, 0.8, 0); state(tl.step1, 'on'); }, 1.2);
      anim(t => draw(L.s, Math.round(t * 120)), 2.4, 3.0, easeInOut); later(() => { dotT.visible = true; pulse(dotT, 0.8, 0); }, 5.6); anim(t => tanAt(t), 1.0, 6.4); on(tl.tan, 7.2); },
    () => { T.knobA.visible = false; T.score7.visible = false; for (const k of ['last', 'score7', 'inA']) state(tl[k], '');
      later(() => { pulse(N3[KA.score], 0.8, 0); state(tl.score7, 'on'); }, 1.0); growT(T.score7, 1.0, 2.4); on(tl.last, 3.4); growT(T.knobA, 1.0, 6.0); on(tl.inA, 7.0); later(() => pulse(lossNode, 0.8, 0), 9.0); },
    () => { PB.show(0); anim(a => PB.show(a), 0.9, 1.6); bars.forEach(b => { b.visible = false; }); T.fan14.forEach(t => { t.visible = false; }); T.knobB.visible = false; ring14.visible = false; for (const k of ['big', 'ring14', 'inB']) state(tl[k], '');
      later(() => { ring14.visible = true; pulse(ring14, 0.8, 0); state(tl.ring14, 'on'); }, 0.8); growAll(T.fan14, 0.8, 2.0, 0.08);
      bars.forEach((b, k) => anim(t => setBar(b, t), 0.6, 3.6 + 0.25 * k)); on(tl.big, 6.6); growT(T.knobB, 1.0, 10.0); on(tl.inB, 10.8); },
    () => { blameRows(0); for (const k of ['bl7', 'bl9', 'bl14', 'bl10', 'chain', 'blame']) state(tl[k], '');
      on(tl.blame, 0.8); later(() => { blameRows(1); state(tl.bl7, 'on'); state(tl.bl9, 'on'); }, 2.4); later(() => { blameRows(2); state(tl.bl14, 'on'); }, 5.0); later(() => { blameRows(3); state(tl.bl10, 'on'); }, 7.6);
      later(() => { pulse(T.knob1, 0.8, 0); state(tl.chain, 'on'); }, 10.0); on(tl.nudged, 11.5); },
    () => { T.fwd.visible = false; T.bwd.visible = false; fwdHead.visible = false; bwdHead.visible = false; state(tl.fwd, ''); state(tl.bwd, '');
      growT(T.fwd, 2.0, 1.0); later(() => { fwdHead.visible = true; state(tl.fwd, 'on'); }, 3.0); growT(T.bwd, 2.0, 5.0); later(() => { bwdHead.visible = true; state(tl.bwd, 'on'); }, 7.0); }
  ];

  // ---------- ledger ----------
  const ledgerEl = document.getElementById('ledger');
  function renderLedger(i) {
    ledgerEl.innerHTML = '<div class="ln title">the chain so far</div>';
    for (let k = 0; k <= i; k++) { if (!steps[k].line) continue; const d = document.createElement('div'); d.className = 'ln' + (k === i ? ' now' : ''); d.innerHTML = steps[k].line; ledgerEl.appendChild(d); }
  }

  // ---------- camera ----------

  K.run({ steps, enter, baseState, ledger: renderLedger });
})();
</script>
