<title>The Bowl</title>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Pill 07: how wrong the network is, as one number (the loss), for one picture and for all 3,823 training pictures.
     Against one knob the loss of the whole set is a bowl; against two knobs it is a bowl surface. Every number on screen
     comes from digits/net.json and digits/loss.json, both produced by numpy scripts next to the training script. */
  :root {
    --bg: #090d1c; --bg2: #11182e; --fg: #eef1fb; --muted: #8e99bd; --line: #273153; --ink: #0b1020;
    --input: #4fd1ff; --knob: #f5b942; --signal: #c084fc; --output: #5eead4; --bad: #fb7185;
    --display: 'Outfit', 'Avenir Next', 'Segoe UI', sans-serif;
    --body: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
  #stage { position: fixed; left: 0; right: 0; top: 0; height: 60%; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #labels { position: fixed; left: 0; right: 0; top: 0; height: 60%; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; font-family: var(--body); font-size: 13px; font-weight: 600; line-height: 1.15; text-align: center; white-space: nowrap;
         transform-origin: center; opacity: 0; transition: opacity .5s, color .5s; color: var(--hue); }
  .lbl.on { opacity: 1; }
  .lbl.dim { color: var(--muted); opacity: .5; }
  .lbl.tag { padding: 3px 8px; border-radius: 6px; background: rgba(9, 13, 28, .78); border: 1px solid var(--line); }
  .lbl.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .lbl.left { text-align: left; transform-origin: left center; }
  .lbl.right { text-align: right; transform-origin: right center; }
  .lbl.head { font-family: var(--display); font-weight: 300; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .lbl.big { font-family: var(--display); font-size: 18px; font-weight: 700; }
  .lbl i { font-style: normal; color: var(--muted); font-weight: 400; }
  #eyebrow { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
             font-family: var(--display); font-weight: 300; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); z-index: 2; }
  #eyebrow b { font-weight: 500; color: var(--fg); }
  #deck { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px;
          background: var(--bg); border-top: 1px solid var(--line); }
  #card { max-width: 860px; margin: 0 auto; width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 8px 28px; align-items: start; }
  #title { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 3vw, 30px); line-height: 1.1; text-wrap: balance; margin: 0; grid-column: 1; }
  #text { font-size: clamp(14px, 1.5vw, 17px); line-height: 1.45; color: var(--fg); margin: 0; max-width: 62ch; grid-column: 1; }
  #ledger { grid-column: 2; grid-row: 1 / span 2; font-family: var(--mono); font-size: clamp(12px, 1.2vw, 14px); line-height: 1.5;
            display: grid; gap: 3px; align-content: start; min-width: 0; padding-left: 14px; border-left: 1px solid var(--line); min-height: 4em; font-variant-numeric: tabular-nums; }
  #ledger .ln { color: var(--muted); overflow-wrap: anywhere; transition: color .4s; }
  #ledger .ln.now { color: var(--fg); }
  #ledger .ln.now .i { color: var(--input); } #ledger .ln.now .k { color: var(--knob); } #ledger .ln.now .s { color: var(--signal); } #ledger .ln.now .o { color: var(--output); } #ledger .ln.now .x { color: var(--bad); }
  #ledger .ln.title { font-family: var(--display); font-weight: 300; letter-spacing: .12em; text-transform: uppercase; font-size: 11px; color: var(--muted); }
  #controls { max-width: 860px; margin: 0 auto; width: 100%; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button { font-family: var(--display); font-weight: 500; font-size: 14px; letter-spacing: .04em; color: var(--fg); background: var(--bg2); border: 1px solid var(--line);
           border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--knob); outline-offset: 2px; }
  #dots { display: flex; gap: 6px; flex: 1; min-width: 120px; }
  #dots span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); position: relative; overflow: hidden; }
  #dots span i { position: absolute; inset: 0; width: 0; background: var(--knob); }
  #dots span.done i { width: 100%; background: var(--muted); }
  #count { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    #eyebrow { font-size: 11px; } .lbl { font-size: 11px; } .lbl.big { font-size: 14px; }
    #card { grid-template-columns: minmax(0, 1fr); }
    #ledger { grid-column: 1; grid-row: auto; border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 6px; min-height: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .lbl { transition: none; } }
</style>

<div id="stage"></div>
<div id="labels"></div>
<div id="eyebrow"><span>Knowledge pill <b>07</b> · the bowl</span><span id="count">1 / 6</span></div>
<div id="deck">
  <div id="card">
    <h1 id="title"></h1>
    <p id="text"></p>
    <div id="ledger"></div>
  </div>
  <div id="controls">
    <button id="prev" type="button" aria-label="Previous step">◀ Back</button>
    <button id="play" type="button" aria-label="Play or pause">Pause</button>
    <button id="next" type="button" aria-label="Next step">Next ▶</button>
    <div id="dots" aria-hidden="true"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.addEventListener('error', e => { document.title = 'ERR ' + e.message + ' @' + e.lineno + ':' + e.colno; });
(function () {
  'use strict';
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- the trained network and the loss numbers measured around it ----------
  const NET = __NET__;
  const LOSS = __LOSS__;
  const S = NET.samples;                                        // a 3, an 8, the 7 read as 9
  const mm = (v, Wm, b) => b.map((bb, j) => { let s = bb; for (let i = 0; i < v.length; i++) s += v[i] * Wm[i][j]; return s; });
  const softmax = z => { const m = Math.max(...z), e = z.map(v => Math.exp(v - m)), s = e.reduce((a, b) => a + b, 0); return e.map(v => v / s); };
  const [KA, KB] = [LOSS.A, LOSS.B], WA0 = LOSS.WA0, WB0 = LOSS.WB0;
  // the 7's own scores as knob A (hidden neuron 6 → score 7, the knob of pill 04) turns
  const x7 = S[2].pixels.map(v => v / 16), h2 = mm(mm(x7, NET.W1, NET.b1).map(Math.tanh), NET.W2, NET.b2).map(Math.tanh), z0 = mm(h2, NET.W3, NET.b3);
  const p7at = w => { const z = z0.slice(); z[KA[1]] += (w - WA0) * h2[KA[0]]; return softmax(z)[7]; };
  const N = LOSS.n, WMIN = LOSS.wmin, WMAX = LOSS.wmax, wAt = k => WMIN + (WMAX - WMIN) * k / N;
  const one = Array.from({ length: N + 1 }, (_, k) => -Math.log(p7at(wAt(k))));    // the 7 alone
  const all = LOSS.curve;                                                            // all 3,823 training pictures
  const nl = v => -Math.log(v);
  const f4 = v => v.toFixed(4), f3 = v => (v >= 0 ? '' : '−') + Math.abs(v).toFixed(3), f2 = v => (v >= 0 ? '' : '−') + Math.abs(v).toFixed(2);
  const pct = v => (v * 100).toFixed(2) + '%', tick = v => (v >= 0 ? '' : '−') + String(Math.abs(v)), n = v => v.toLocaleString('en');

  // ---------- scene ----------
  const stage = document.getElementById('stage'), labelsEl = document.getElementById('labels'), deck = document.getElementById('deck');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x090d1c);
  scene.fog = new THREE.Fog(0x090d1c, 70, 150);
  const VFOV = 40;
  const camera = new THREE.PerspectiveCamera(VFOV, 1, 0.1, 300);
  const camTarget = new THREE.Vector3(0, 0, 0), camGoal = new THREE.Vector3(0, 0, 0);
  let camRadius = 30, camRadiusGoal = 30, camYaw = 0, camYawGoal = 0, camElev = 0.06, camElevGoal = 0.06;
  scene.add(new THREE.AmbientLight(0x9aa6cc, 0.8));
  const key = new THREE.DirectionalLight(0xffffff, 0.6); key.position.set(-6, 12, 14); scene.add(key);
  const grid = new THREE.GridHelper(220, 110, 0x1c2544, 0x151d38); grid.position.set(15, -8.8, -20); scene.add(grid);
  const C = { input: 0x4fd1ff, knob: 0xf5b942, signal: 0xc084fc, output: 0x5eead4, node: 0x3a4a86, bad: 0xfb7185, dark: 0x11182e, dim: 0x4a557a, axis: 0x3a4670, faint: 0x1e2746 };
  function glowMat(color) { return new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0, roughness: 0.45, metalness: 0.1, transparent: true, opacity: 1, side: THREE.DoubleSide }); }
  const lineMat = (color, op) => new THREE.LineBasicMaterial({ color, transparent: true, opacity: op });

  // ---------- labels ----------
  const labels = [];
  function label(hueCss, obj, base, ref) { const el = document.createElement('div'); el.className = 'lbl ' + (base || ''); el.style.setProperty('--hue', hueCss); labelsEl.appendChild(el); const L = { el, obj, base: base || '', ref: ref || 30, left: (base || '').includes('left'), right: (base || '').includes('right') }; labels.push(L); return L; }
  function say(L, html) { L.el.innerHTML = html; }
  function state(L, s) { L.el.className = 'lbl ' + L.base + (s === 'on' ? ' on' : s === 'dim' ? ' on dim' : ''); }
  const tmp = new THREE.Vector3();
  function placeLabels() {
    const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight, tanV = Math.tan(VFOV / 2 * Math.PI / 180);
    for (const L of labels) {
      if (!L.el.classList.contains('on')) continue;
      L.obj.getWorldPosition(tmp);
      const dist = tmp.distanceTo(camera.position), s = Math.max(0.1, Math.min(2.5, h / (2 * dist * tanV) / L.ref));
      tmp.project(camera);
      L.el.style.transform = `translate(${L.left ? '0' : L.right ? '-100%' : '-50%'},-50%) translate(${(tmp.x * .5 + .5) * w}px,${(tmp.y * -.5 + .5) * h}px) scale(${s.toFixed(3)})`;
    }
  }
  const anchor = (x, y, parent, z) => { const a = new THREE.Object3D(); a.position.set(x, y, z || 0); (parent || scene).add(a); return a; };
  const mk = (hue, x, y, cls, parent, z) => label(hue, anchor(x, y, parent, z), cls, 30);

  // ---------- the three pictures with their score for the right digit ----------
  const PICX = -16.2, PICY = [4.6, 0, -4.6], TP = 0.92;
  const tileGeo = new THREE.PlaneGeometry(0.84, 0.84), bgCol = new THREE.Color(C.dark), inCol = new THREE.Color(C.input);
  const pics = S.map((s, k) => {
    const g = new THREE.Group(); g.position.set(PICX, PICY[k], 0); g.scale.setScalar(0.45); scene.add(g);
    for (let i = 0; i < 64; i++) { const v = s.pixels[i] / 16, t = new THREE.Mesh(tileGeo, glowMat(C.dark)); t.material.color.copy(bgCol).lerp(inCol, v); t.material.emissive.copy(t.material.color); t.material.emissiveIntensity = 0.25 + 0.5 * v; t.position.set((i % 8 - 3.5) * TP, (3.5 - Math.floor(i / 8)) * TP, 0); g.add(t); }
    const head = mk('#8e99bd', -4.6, 0, 'head', g); say(head, `a ${s.label}`);
    const tag = mk(k === 2 ? '#fb7185' : '#5eead4', 5.2, 0.5, 'tag mono left', g); say(tag, `score for ${s.label}: ${pct(s.probs[s.label])}`);
    const lossTag = mk(k === 2 ? '#fb7185' : '#5eead4', 5.2, -1.3, 'tag mono left', g); say(lossTag, `loss ${f4(nl(s.probs[s.label]))}`);
    return { g, head, tag, lossTag, p: s.probs[s.label], loss: nl(s.probs[s.label]) };
  });

  // ---------- panels ----------
  function makePanel(o) {
    const g = new THREE.Group(); scene.add(g);
    const px = v => o.x0 + (v - o.xmin) / (o.xmax - o.xmin) * o.w, py = v => o.y0 + (v - o.ymin) / (o.ymax - o.ymin) * o.h;
    const mats = [], pls = [];
    function line(pts, color, op, z) { const m = lineMat(color, op); m.userData.op = op; const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p[0], p[1], z || 0))), m); g.add(l); mats.push(m); return l; }
    for (const t of o.yt) if (t !== 0) line([[o.x0 - 0.2, py(t)], [o.x0 + o.w + 0.4, py(t)]], C.faint, 0.9);
    for (const t of o.xt) if (t !== 0) line([[px(t), o.y0 - 0.2], [px(t), o.y0 + o.h + 0.3]], C.faint, 0.9);
    const ax = Math.max(o.ymin, Math.min(o.ymax, 0)), ay = Math.max(o.xmin, Math.min(o.xmax, 0));
    line([[o.x0 - 0.2, py(ax)], [o.x0 + o.w + 0.4, py(ax)]], C.axis, 0.9);
    line([[px(ay), o.y0 - 0.2], [px(ay), o.y0 + o.h + 0.3]], C.axis, 0.9);
    for (const t of o.xt) { const L = mk('#8e99bd', px(t), o.y0 - 0.55, 'mono'); say(L, o.xf ? o.xf(t) : tick(t)); pls.push(L); }
    for (const t of o.yt) { const L = mk('#8e99bd', o.x0 - 0.85, py(t), 'mono'); say(L, o.yf ? o.yf(t) : tick(t)); pls.push(L); }
    const xName = mk(o.xHue, o.x0 + o.w / 2, o.y0 - 1.35, 'tag'); say(xName, o.xName); pls.push(xName);
    const yName = mk(o.yHue, o.x0 + o.w / 2, o.y0 + o.h + 0.95, 'tag'); say(yName, o.yName); pls.push(yName);
    const P = { g, px, py, xName, yName, add: (pts, color, z, op) => line(pts, color, op || 1, z || 0.02),
      dot(color, r) { const d = new THREE.Mesh(new THREE.SphereGeometry(r || 0.17, 24, 16), glowMat(color || C.signal)); d.material.emissiveIntensity = 1; d.visible = false; g.add(d); return d; },
      show(a) { g.visible = a > 0.01; for (const m of mats) m.opacity = a * m.userData.op; for (const L of pls) state(L, a > 0.5 ? 'on' : ''); } };
    P.show(0); return P;
  }
  const PW = 8, PH = 8, PY0 = -4;
  const P0 = makePanel({ x0: -8.0, w: PW, y0: PY0, h: PH, xmin: 0, xmax: 1, ymin: 0, ymax: 7, xt: [0, 0.25, 0.5, 0.75, 1], yt: [0, 1, 2, 3, 4, 5, 6, 7], xf: v => Math.round(v * 100) + '%', xName: 'score given to the right digit', yName: 'loss = −log(score)', xHue: '#5eead4', yHue: '#fb7185' });
  const P1 = makePanel({ x0: 12.0, w: PW, y0: PY0, h: PH, xmin: WMIN, xmax: WMAX, ymin: 0, ymax: 10, xt: [-6, -3, 0, 3, 6], yt: [0, 2, 4, 6, 8, 10], xName: 'w = the knob of pill 04', yName: 'loss of the 7 alone', xHue: '#f5b942', yHue: '#fb7185' });
  const P2 = makePanel({ x0: 23.2, w: PW, y0: PY0, h: PH, xmin: WMIN, xmax: WMAX, ymin: 0, ymax: 0.3, xt: [-6, -3, 0, 3, 6], yt: [0, 0.1, 0.2, 0.3], xName: 'w = the same knob', yName: `loss over all ${n(LOSS.n_train)} pictures`, xHue: '#f5b942', yHue: '#5eead4' });
  const pts = (P, xs, f) => xs.map(x => [P.px(x), P.py(f(x))]);
  const ss = Array.from({ length: 121 }, (_, k) => 0.002 + 0.998 * k / 120), ws = Array.from({ length: N + 1 }, (_, k) => wAt(k));
  const L = {
    nlog: P0.add(pts(P0, ss, nl), C.bad), one: P1.add(ws.map((w, k) => [P1.px(w), P1.py(Math.min(10, one[k]))]), C.bad), all: P2.add(ws.map((w, k) => [P2.px(w), P2.py(all[k])]), C.output),
    arrow: P2.add([[P2.px(WA0), P2.py(LOSS.loss_now) + 0.35], [P2.px(LOSS.bottom.w), P2.py(LOSS.bottom.loss) + 0.35]], C.knob, 0.03)
  };
  for (const k of Object.keys(L)) L[k].geometry.setDrawRange(0, 0);
  const dots = { p0: P0.dot(C.bad), p1: P1.dot(C.bad), p2: P2.dot(C.output) };
  const marks = { s: pics.map((p, k) => { const d = P0.dot(k === 2 ? C.bad : C.output); d.position.set(P0.px(p.p), P0.py(p.loss), 0.04); return d; }),
    now1: P1.dot(C.knob, 0.2), now2: P2.dot(C.knob, 0.2), bottom: P2.dot(C.output, 0.2) };
  marks.now1.position.set(P1.px(WA0), P1.py(nl(S[2].probs[7])), 0.04); marks.now2.position.set(P2.px(WA0), P2.py(LOSS.loss_now), 0.04); marks.bottom.position.set(P2.px(LOSS.bottom.w), P2.py(LOSS.bottom.loss), 0.04);
  // the "before and now" bars: the loss of the network before training and after
  const BX = 2.4, BARW = 7.0, bars = new THREE.Group(); scene.add(bars);
  const barOf = (y, v, color) => { const m = new THREE.Mesh(new THREE.BoxGeometry(1, 0.7, 0.3), glowMat(color)); m.material.emissiveIntensity = 0.5; m.position.set(BX, y, 0); m.scale.x = 0.01; bars.add(m); return m; };
  const barBefore = barOf(1.6, LOSS.untrained_loss, C.bad), barNow = barOf(-0.4, LOSS.train_loss, C.output);
  const barLen = v => Math.max(0.05, v / LOSS.untrained_loss * BARW);
  const tl = {
    rule: mk('#8e99bd', P0.px(0.5), P0.py(4.8), 'tag'), half: mk('#8e99bd', P0.px(0.75), P0.py(0.29) + 0.7, 'tag mono'),
    before: mk('#fb7185', BX, 2.5, 'tag mono left'), now: mk('#5eead4', BX, 0.5, 'tag mono left'), barHead: mk('#8e99bd', BX + BARW / 2, 3.6, 'head'),
    one: mk('#fb7185', P1.px(2.6), P1.py(2.2), 'tag'), now1: mk('#f5b942', P1.px(WA0) + 0.3, P1.py(nl(S[2].probs[7])) - 0.75, 'tag mono'),
    all: mk('#5eead4', P2.px(2.4), P2.py(0.14), 'tag'), now2: mk('#f5b942', P2.px(WA0) - 1.2, P2.py(LOSS.loss_now) + 1.1, 'tag mono'),
    bottom: mk('#5eead4', P2.px(LOSS.bottom.w) + 1.5, P2.py(LOSS.bottom.loss) - 0.75, 'tag mono'), way: mk('#f5b942', P2.px(LOSS.bottom.w) + 1.4, P2.py(LOSS.loss_now) + 1.1, 'tag')
  };
  say(tl.rule, 'loss = −log(score): 100% costs 0, 50% costs 0.69, 10% costs 2.30'); say(tl.half, 'every halving adds 0.69');
  say(tl.before, `before training: ${f2(LOSS.untrained_loss)}`); say(tl.now, `now: ${f4(LOSS.train_loss)}`); say(tl.barHead, `the loss of the network · average over ${n(LOSS.n_train)} pictures`);
  say(tl.one, 'the 7 alone: left is always better'); say(tl.now1, `now: w = ${f2(WA0)}, loss ${f2(nl(S[2].probs[7]))}`);
  say(tl.all, 'all pictures: a bowl'); say(tl.now2, `now: ${f2(WA0)} → ${f4(LOSS.loss_now)}`); say(tl.bottom, `bottom: ${f2(LOSS.bottom.w)} → ${f4(LOSS.bottom.loss)}`); say(tl.way, 'downhill, to the bottom');

  // ---------- the bowl surface: the loss over two knobs ----------
  const G = LOSS.grid_n, SX = 41.0, SY = -4.2, SW = 12, HMAX = Math.max(...LOSS.grid.flat()), HS = 6.5 / HMAX;
  const surf = new THREE.Group(); surf.position.set(SX, SY, 0); scene.add(surf);
  const sx = wa => (wa - WMIN) / (WMAX - WMIN) * SW - SW / 2, sz = wb => -((wb - WMIN) / (WMAX - WMIN) * SW - SW / 2), sy = l => l * HS;
  const geo = new THREE.PlaneGeometry(SW, SW, G, G); geo.rotateX(-Math.PI / 2);
  { const pos = geo.attributes.position, col = new Float32Array(pos.count * 3), lo = new THREE.Color(C.output), hi = new THREE.Color(C.bad), c = new THREE.Color();
    for (let i = 0; i < pos.count; i++) { const ia = i % (G + 1), ib = Math.floor(i / (G + 1)); const l = LOSS.grid[G - ib][ia]; pos.setY(i, sy(l)); c.copy(lo).lerp(hi, Math.pow(l / HMAX, 0.5)); col.set([c.r, c.g, c.b], i * 3); }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.computeVertexNormals(); }
  const surfMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.7, metalness: 0.05, transparent: true, opacity: 0 })); surf.add(surfMesh);
  const surfWire = new THREE.LineSegments(new THREE.WireframeGeometry(geo), new THREE.LineBasicMaterial({ color: 0x0b1020, transparent: true, opacity: 0 })); surf.add(surfWire);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 16), glowMat(C.knob)); ball.material.emissiveIntensity = 0.9; ball.position.set(sx(WA0), sy(LOSS.loss_now) + 0.28, sz(WB0)); ball.visible = false; surf.add(ball);
  const bottomBall = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 16), glowMat(C.output)); bottomBall.material.emissiveIntensity = 0.9; bottomBall.position.set(sx(LOSS.bottom2.wa), sy(LOSS.bottom2.loss) + 0.22, sz(LOSS.bottom2.wb)); bottomBall.visible = false; surf.add(bottomBall);
  const sl = { a: mk('#f5b942', 0, -0.9, 'tag', surf, SW / 2 + 0.6), b: mk('#c084fc', SW / 2 + 0.9, -0.9, 'tag', surf, 0), h: mk('#fb7185', SW / 2 + 0.6, sy(HMAX) + 0.3, 'tag', surf, -SW / 2),
    ball: mk('#f5b942', sx(WA0), sy(LOSS.loss_now) + 1.2, 'tag mono', surf, sz(WB0)), bottom: mk('#5eead4', sx(LOSS.bottom2.wa) + 1.4, sy(LOSS.bottom2.loss) - 0.6, 'tag mono', surf, sz(LOSS.bottom2.wb)) };
  say(sl.a, `knob A: hidden ${KA[0]} → score 7`); say(sl.b, `knob B: hidden ${KB[0]} → score 9`); say(sl.h, 'loss, up');
  say(sl.ball, `the network now: (${f2(WA0)}, ${f2(WB0)}) → ${f4(LOSS.loss_now)}`); say(sl.bottom, `bottom: (${f2(LOSS.bottom2.wa)}, ${f2(LOSS.bottom2.wb)}) → ${f4(LOSS.bottom2.loss)}`);
  function setSurf(a) { surfMesh.material.opacity = a; surfWire.material.opacity = 0.35 * a; surf.visible = a > 0.01; }

  // ---------- tiny tween engine ----------
  const anims = []; let now = 0;
  const easeOut = t => 1 - Math.pow(1 - t, 3), easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, linear = t => t;
  function anim(fn, dur, delay, ease) { anims.push({ fn, start: now + (reduced ? 0 : (delay || 0)), dur: reduced ? 0.01 : dur, ease: ease || easeOut, done: false }); }
  const lerp = (a, b, t) => a + (b - a) * t;
  function pulse(mesh, dur, delay) { const s = mesh.scale.x; anim(t => { mesh.scale.setScalar(s * (1 + 0.3 * Math.sin(Math.PI * t))); }, dur, delay); }
  function later(fn, s) { anim(t => { if (t >= 1) fn(); }, 0.01, s, linear); }
  function draw(line, k) { line.geometry.setDrawRange(0, Math.max(line.geometry.drawRange.count, k + 1)); }
  // sweep a dot along a curve, drawing it underneath; xs(k) gives the x value and ys(k) the y value for sample k of M
  function sweep(P, dot, line, M, xs, ys, dur, delay, label, labelAt) { dot.visible = false; later(() => { dot.visible = true; }, delay);
    anim(t => { const k = Math.round(t * M); dot.position.set(P.px(xs(k)), P.py(ys(k)), 0.05); draw(line, k); if (label && labelAt !== undefined && t >= labelAt) state(label, 'on'); }, dur, delay, easeInOut); }
  function stepAnims() { for (const a of anims) { if (a.done) continue; const t = (now - a.start) / a.dur; if (t < 0) continue; const k = Math.min(1, t); a.fn(a.ease(k)); if (k >= 1) a.done = true; } for (let i = anims.length - 1; i >= 0; i--) if (anims[i].done) anims.splice(i, 1); }
  function clearAnims() { anims.length = 0; }

  // ---------- the steps ----------
  const S1 = [-21.6, 1.4, -6.8, 7.0], S2 = [-9.6, 11.0, -6.8, 7.0], S3 = [9.6, 21.6, -6.0, 5.9], S4 = [9.6, 32.8, -6.0, 5.9], S5 = [P2.px(-1.5) - 0.6, P2.px(6) + 1.6, P2.py(0) - 1.9, P2.py(0.15) + 0.6], S6 = [SX - 13, SX + 13, SY - 4, SY + 10];
  const steps = [
    { dur: 19, title: 'How wrong, as one number', box: S1, yaw: -0.06,
      text: `Three pictures, and for each the score the network gave the right digit: ${pct(S[0].probs[3])} for the 3, ${pct(S[1].probs[8])} for the 8, ${pct(S[2].probs[7])} for the 7 it read as a 9. The loss turns that score into a cost: −log of the score. A score of 100% costs nothing, 50% costs 0.69, 10% costs 2.30, and the 7 costs ${f2(nl(S[2].probs[7]))}. The exact rule matters less than its shape: every halving of the score adds the same 0.69, so being confidently wrong costs far more than being unsure. How wrong, as one number per picture.`,
      line: `loss = −log(score for the right digit) · the 3: ${f4(pics[0].loss)} · the 8: ${f4(pics[1].loss)} · <span class="x">the 7: ${f2(pics[2].loss)}</span>` },
    { dur: 15, title: 'One number for all of them', box: S2, yaw: 0,
      text: `Average that cost over the ${n(LOSS.n_train)} pictures the network learns from, and the whole network has one number: ${f4(LOSS.train_loss)}. Before training, with its random start, the same number was ${f2(LOSS.untrained_loss)}: the right digit got about 10% on average, a guess. Training is nothing but pushing this one number down. It is the score of the knobs, all 2,778 of them at once, and every pill from here on serves it.`,
      line: `the network’s loss: before <span class="x">${f2(LOSS.untrained_loss)}</span> · now <span class="o">${f4(LOSS.train_loss)}</span>` },
    { dur: 17, title: 'One knob, one picture', box: S3, yaw: 0.04,
      text: `Back to the knob of pill 04, the wire from hidden neuron ${KA[0]} to the score for 7, at ${f2(WA0)}. Turn it from −6 to 6 and record the loss of the 7 alone. Left, the 7’s score rises and its cost falls, all the way down to ${f2(one[0])} at −6. Right, the cost climbs past ${Math.floor(one[N])}. No bottom in sight: if this picture were the whole world, the knob would go left and keep going.`,
      line: `the 7 alone: loss ${f2(one[0])} at −6 · ${f2(nl(S[2].probs[7]))} now · ${f2(one[N])} at 6` },
    { dur: 21, title: 'One knob, every picture', box: S4, yaw: 0.06,
      text: `Now the same knob, the same turn, but the loss averaged over all ${n(LOSS.n_train)} pictures. This curve is a bowl. Steep on the left, exactly where the 7 wanted to go, because there it breaks hundreds of other pictures. Its bottom is at ${f2(LOSS.bottom.w)}, a little to the right of where the knob stands. One picture pulls one way, the other ${n(LOSS.n_train - 1)} pull the other, and the average is the referee. That is why this 7 stays wrong: fixing it alone would cost the crowd more than it gains.`,
      line: `all pictures: a bowl · bottom at w = ${f2(LOSS.bottom.w)}, the knob at ${f2(WA0)}` },
    { dur: 15, title: 'The bottom of the bowl', box: S5, yaw: 0,
      text: `Which way, and how far, now has an answer for this knob: downhill, to the bottom. From ${f2(WA0)} to ${f2(LOSS.bottom.w)} the loss drops from ${f4(LOSS.loss_now)} to ${f4(LOSS.bottom.loss)}, a tiny gain, because training already left this knob near its bottom. And the bottom is not fixed: it moves whenever any other knob moves. So training is never one jump. It is a small turn, a new measurement, another small turn.`,
      line: `downhill: ${f2(WA0)} → ${f2(LOSS.bottom.w)} · loss ${f4(LOSS.loss_now)} → ${f4(LOSS.bottom.loss)}` },
    { dur: 22, title: 'Two knobs: a bowl to look at', box: S6, yaw: 0.6, elev: 0.7,
      text: `Add a second knob, a wire into the score for 9, and the loss over both is a surface: lopsided, but a bowl, with one lowest point. The ball is where the network stands, at (${f2(WA0)}, ${f2(WB0)}); the bottom is at (${f2(LOSS.bottom2.wa)}, ${f2(LOSS.bottom2.wb)}), a short roll away. With 2,778 knobs the bowl has 2,778 directions and nobody can draw it or look for its bottom. But at every point it still has a downhill, and that downhill can be read from the numbers alone. Reading it is the slope, the next pill.`,
      line: `two knobs: a bowl surface · 2,778 knobs: a bowl nobody can draw, but it has a downhill` }
  ];

  // deterministic resting state at the start of step i
  function baseState(i) {
    clearAnims();
    pics.forEach((p, k) => { state(p.head, i === 0 ? 'on' : 'dim'); state(p.tag, i === 0 ? 'on' : 'dim'); state(p.lossTag, i === 0 ? 'on' : 'dim'); });
    P0.show(1); P1.show(i >= 2 ? 1 : 0); P2.show(i >= 3 ? 1 : 0);
    L.nlog.geometry.setDrawRange(0, i >= 1 ? 121 : 0); L.one.geometry.setDrawRange(0, i >= 3 ? N + 1 : 0); L.all.geometry.setDrawRange(0, i >= 4 ? N + 1 : 0); L.arrow.geometry.setDrawRange(0, i >= 5 ? 2 : 0);
    L.nlog.material.color.setHex(i === 0 ? C.bad : C.dim); L.one.material.color.setHex(i === 2 ? C.bad : C.dim); L.all.material.color.setHex(i === 3 || i === 4 ? C.output : C.dim); L.arrow.material.color.setHex(i === 4 ? C.knob : C.dim);
    for (const d of Object.values(dots)) d.visible = false;
    marks.s.forEach(d => { d.visible = i >= 1; }); marks.now1.visible = i >= 3; marks.now2.visible = i >= 4; marks.bottom.visible = i >= 5;
    const dimOn = (lab, on, hot) => state(lab, on ? (hot ? 'on' : 'dim') : '');
    dimOn(tl.rule, i >= 1, i === 0); dimOn(tl.half, i >= 1, i === 0);
    bars.visible = i >= 1; barBefore.scale.x = barLen(LOSS.untrained_loss); barBefore.position.x = BX + barBefore.scale.x / 2; barNow.scale.x = barLen(LOSS.train_loss); barNow.position.x = BX + barNow.scale.x / 2;
    dimOn(tl.before, i >= 2, i === 1); dimOn(tl.now, i >= 2, i === 1); dimOn(tl.barHead, i >= 2, i === 1);
    dimOn(tl.one, i >= 3, i === 2); dimOn(tl.now1, i >= 3, i === 2);
    dimOn(tl.all, i >= 4, i === 3); dimOn(tl.now2, i >= 4, i === 3 || i === 4); dimOn(tl.bottom, i >= 5, i === 4); dimOn(tl.way, i >= 5, i === 4);
    for (const [P, hot] of [[P0, i === 0], [P1, i === 2], [P2, i === 3 || i === 4]]) if (P.g.visible) { state(P.xName, hot ? 'on' : 'dim'); state(P.yName, hot ? 'on' : 'dim'); }
    setSurf(i >= 5 ? 1 : 0); ball.visible = i >= 5; bottomBall.visible = i >= 5; for (const k of Object.keys(sl)) state(sl[k], i >= 5 ? 'on' : '');
  }

  const enter = [
    () => { // the −log curve is drawn right to left, from a perfect score down to a near-zero one; the three pictures land on it
      P0.show(0); anim(a => P0.show(a), 0.9, 0.4); L.nlog.geometry.setDrawRange(0, 0); state(tl.rule, ''); state(tl.half, ''); marks.s.forEach(d => { d.visible = false; });
      pics.forEach((p, k) => { state(p.tag, ''); state(p.lossTag, ''); later(() => state(p.tag, 'on'), 0.6 + 0.5 * k); });
      // draw from 100% leftwards: sample index runs 120 → 0
      sweep(P0, dots.p0, { geometry: { setDrawRange(a, c) { L.nlog.geometry.setDrawRange(121 - c, c); }, drawRange: { count: 0 } } }, 120, k => ss[120 - k], k => nl(ss[120 - k]), 5.5, 2.4);
      later(() => state(tl.rule, 'on'), 4.0); later(() => state(tl.half, 'on'), 7.0);
      pics.forEach((p, k) => later(() => { marks.s[k].visible = true; pulse(marks.s[k], 0.8, 0); state(p.lossTag, 'on'); }, 8.6 + 1.0 * k));
    },
    () => { // the bars: before training, then now
      bars.visible = true; barBefore.scale.x = 0.01; barNow.scale.x = 0.01; state(tl.before, ''); state(tl.now, ''); state(tl.barHead, ''); later(() => state(tl.barHead, 'on'), 0.6);
      anim(t => { barBefore.scale.x = Math.max(0.01, barLen(LOSS.untrained_loss) * t); barBefore.position.x = BX + barBefore.scale.x / 2; }, 1.6, 1.2); later(() => state(tl.before, 'on'), 1.4);
      anim(t => { barNow.scale.x = Math.max(0.01, barLen(LOSS.train_loss) * t); barNow.position.x = BX + barNow.scale.x / 2; }, 1.2, 4.2); later(() => { state(tl.now, 'on'); pulse(barNow, 0.8, 0); }, 4.4);
    },
    () => { P1.show(0); anim(a => P1.show(a), 0.9, 0.4); L.one.geometry.setDrawRange(0, 0); marks.now1.visible = false; state(tl.one, ''); state(tl.now1, '');
      later(() => { marks.now1.visible = true; pulse(marks.now1, 0.8, 0); state(tl.now1, 'on'); }, 1.6);
      sweep(P1, dots.p1, L.one, N, k => wAt(k), k => Math.min(10, one[k]), 6.5, 3.0, tl.one, 0.55); },
    () => { P2.show(0); anim(a => P2.show(a), 0.9, 0.4); L.all.geometry.setDrawRange(0, 0); marks.now2.visible = false; state(tl.all, ''); state(tl.now2, '');
      later(() => { marks.now2.visible = true; pulse(marks.now2, 0.8, 0); state(tl.now2, 'on'); }, 1.6);
      sweep(P2, dots.p2, L.all, N, k => wAt(k), k => all[k], 7.0, 3.0, tl.all, 0.5); },
    () => { marks.bottom.visible = false; L.arrow.geometry.setDrawRange(0, 0); state(tl.bottom, ''); state(tl.way, '');
      later(() => { marks.bottom.visible = true; pulse(marks.bottom, 0.9, 0); state(tl.bottom, 'on'); }, 1.6);
      later(() => { L.arrow.geometry.setDrawRange(0, 2); state(tl.way, 'on'); pulse(marks.now2, 0.9, 0); }, 4.0); },
    () => { setSurf(0); anim(a => setSurf(a), 1.6, 0.6); ball.visible = false; bottomBall.visible = false; for (const k of Object.keys(sl)) state(sl[k], '');
      later(() => { for (const k of ['a', 'b', 'h']) state(sl[k], 'on'); }, 2.0);
      later(() => { ball.visible = true; pulse(ball, 0.9, 0); state(sl.ball, 'on'); }, 4.0); later(() => { bottomBall.visible = true; pulse(bottomBall, 0.9, 0); state(sl.bottom, 'on'); }, 7.0); }
  ];

  // ---------- ledger ----------
  const ledgerEl = document.getElementById('ledger');
  function renderLedger(i) {
    ledgerEl.innerHTML = '<div class="ln title">the loss so far</div>';
    for (let k = 0; k <= i; k++) { if (!steps[k].line) continue; const d = document.createElement('div'); d.className = 'ln' + (k === i ? ' now' : ''); d.innerHTML = steps[k].line; ledgerEl.appendChild(d); }
  }

  // ---------- camera ----------
  let curBox = S1;
  function fitRadius(box) {
    const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight, aspect = w / h;
    const pad = w < 640 ? 1.45 : 1.14;
    const halfW = (box[1] - box[0]) / 2 * pad, halfH = (box[3] - box[2]) / 2 * pad, tanV = Math.tan(VFOV / 2 * Math.PI / 180);
    return Math.max(halfH / tanV, halfW / (tanV * aspect), 2);
  }
  function setCamera(s) { curBox = s.box; camRadiusGoal = fitRadius(s.box); camYawGoal = s.yaw; camElevGoal = s.elev || 0.06; camGoal.set((s.box[0] + s.box[1]) / 2, (s.box[2] + s.box[3]) / 2, 0); }

  // ---------- player ----------
  let step = -1, playing = !reduced, stepStart = 0;
  const countEl = document.getElementById('count'), dotsEl = document.getElementById('dots'), playBtn = document.getElementById('play');
  const titleEl = document.getElementById('title'), textEl = document.getElementById('text');
  steps.forEach(() => { const s = document.createElement('span'); s.appendChild(document.createElement('i')); dotsEl.appendChild(s); });
  function go(i, instant) {
    const prev = step;
    step = (i + steps.length) % steps.length; stepStart = now;
    baseState(step);
    titleEl.textContent = steps[step].title; textEl.textContent = steps[step].text; renderLedger(step);
    countEl.textContent = (step + 1) + ' / ' + steps.length;
    [...dotsEl.children].forEach((d, k) => { d.classList.toggle('done', k < step); d.firstChild.style.width = k === step ? '0%' : ''; });
    layout(); setCamera(steps[step]);
    if (instant) { camRadius = camRadiusGoal; camYaw = camYawGoal; camElev = camElevGoal; camTarget.copy(camGoal); }
    if (prev < 0 || prev === step - 1) enter[step]();
  }
  function setPlaying(p) { playing = p; playBtn.textContent = p ? 'Pause' : 'Play'; }
  document.getElementById('next').onclick = () => go(step + 1);
  document.getElementById('prev').onclick = () => go(step - 1);
  playBtn.onclick = () => setPlaying(!playing);
  window.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1); else if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); } });

  function layout() {
    const h = Math.max(160, window.innerHeight - deck.offsetHeight);
    stage.style.height = h + 'px'; labelsEl.style.height = h + 'px';
    const w = stage.clientWidth; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    if (step >= 0) camRadiusGoal = fitRadius(curBox);
  }
  window.addEventListener('resize', layout);

  let last = performance.now();
  function frame(tms) {
    const dt = Math.min(document.hidden ? 1 : 0.05, (tms - last) / 1000); last = tms; now += dt;
    if (playing) { const el = now - stepStart, d = steps[step].dur; dotsEl.children[step].firstChild.style.width = Math.min(100, 100 * el / d) + '%'; if (el >= d) { if (step === steps.length - 1) setPlaying(false); else go(step + 1); } }
    stepAnims();
    const k = reduced ? 1 : 1 - Math.pow(0.03, dt);
    camRadius = lerp(camRadius, camRadiusGoal, k); camYaw = lerp(camYaw, camYawGoal, k); camElev = lerp(camElev, camElevGoal, k); camTarget.lerp(camGoal, k);
    const drift = reduced ? 0 : Math.sin(now * 0.2) * 0.02;
    camera.position.set(camTarget.x + Math.sin(camYaw + drift) * camRadius, camTarget.y + camRadius * camElev, camTarget.z + Math.cos(camYaw + drift) * camRadius);
    camera.lookAt(camTarget);
    placeLabels();
    renderer.render(scene, camera);
    schedule(frame);
  }
  function schedule(fn) { if (document.hidden) setTimeout(() => fn(performance.now()), 33); else requestAnimationFrame(fn); }
  layout(); go(0, true); schedule(frame);
})();
</script>
