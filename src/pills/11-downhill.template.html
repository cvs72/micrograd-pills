<script type="module">
/* Pill 11: training the digit network on screen. The rule new = old − step × slope applied to all 2,778 knobs,
the step size, batches of 32 pictures, the loss falling and the accuracy rising over 60 passes, the knobs
settling, and what the first-row weights became. Every number comes from digits/descent.json: train.py's run
replayed step by step by a numpy script next to it, ending on the exact weights of net.json. */
(function () {
  'use strict';
  const K = Pill.create({ fog: [90,190], far: 400, radius: 40, grid: [260,130,0,-18.5] });
  const { label, say, state, anim, pulse, later, on, fadeIn, drawTo, clearAnims, makePanel, scene, easeInOut } = K;

  // ---------- the training run, replayed ----------
  const D = __DESCENT__;
  const F = D.first, PP = D.per_pass, R = D.rates, LAST = PP[PP.length - 1];
  const f4 = v => (v >= 0 ? '' : '−') + Math.abs(v).toFixed(4), f3 = v => (v >= 0 ? '' : '−') + Math.abs(v).toFixed(3), f2 = v => (v >= 0 ? '' : '−') + Math.abs(v).toFixed(2);
  const pct1 = v => (v * 100).toFixed(1) + '%', pct2 = v => (v * 100).toFixed(2) + '%', n = v => v.toLocaleString('en');
  const sg = v => (v > 0 ? '+' : '') + f4(v);

  // ---------- scene ----------
  const C = { input: 0x4fd1ff, knob: 0xf5b942, signal: 0xc084fc, output: 0x5eead4, bad: 0xfb7185, node: 0x3a4a86, dark: 0x11182e, dim: 0x4a557a, axis: 0x3a4670, faint: 0x1e2746, muted: 0x8e99bd };
  const COL = Object.fromEntries(Object.entries(C).map(([k, v]) => [k, new THREE.Color(v)]));

  // ---------- labels ----------
  const anchor = (x, y, z) => { const a = new THREE.Object3D(); a.position.set(x, y, z || 0); scene.add(a); return a; };
  const mk = (hue, x, y, cls, ref) => label(hue, anchor(x, y, 0.1), cls, ref || 30);

  // ---------- tiles in bulk: one geometry per block, a colour per tile ----------
  function quads(x0, ytop, rows, cols, pitch, size, colorAt) {
    const pos = new Float32Array(rows * cols * 4 * 3), col = new Float32Array(rows * cols * 4 * 3), idx = []; let k = 0;
    const c = new THREE.Color();
    for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
      const cx = x0 + (q + 0.5) * pitch, cy = ytop - (r + 0.5) * pitch, hs = size / 2; colorAt(r, q, c);
      const v = k * 4; const corners = [[cx - hs, cy - hs], [cx + hs, cy - hs], [cx + hs, cy + hs], [cx - hs, cy + hs]];
      corners.forEach((p, j) => { pos.set([p[0], p[1], 0], (v + j) * 3); col.set([c.r, c.g, c.b], (v + j) * 3); });
      idx.push(v, v + 1, v + 2, v, v + 2, v + 3); k++;
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setIndex(idx);
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 1, side: THREE.DoubleSide })); scene.add(m); return m;
  }
  const shade = (c, base, a) => c.copy(COL.dark).lerp(base, 0.08 + 0.92 * Math.min(1, a));

  // the field: the 2,778 slopes of the first step (32 pictures), teal = turn up, pink = turn down
  const T = 0.2, FTOP = 9.5, FX1 = -31, FX2 = -17, FX3 = -9.5, GMAX = F.max_abs_slope;
  const slopeCol = (c, g) => shade(c, g < 0 ? COL.output : COL.bad, Math.sqrt(Math.abs(g) / GMAX));
  const block = (x0, W, b, nIn, nOut) => quads(x0, FTOP, nOut, nIn + 1, T, 0.17, (r, q, c) => slopeCol(c, q < nIn ? W[q][r] : b[r]));
  const field = [block(FX1, F.field.W1, F.field.b1, 64, 32), block(FX2, F.field.W2, F.field.b2, 32, 16), block(FX3, F.field.W3, F.field.b3, 16, 10)];
  const bigAt = [FX3 + (16 + 0.5) * T, FTOP - (F.big.at[0] + 0.5) * T];  // the steepest knob of the batch: b3[2], the bias column of the last block
  const bigFrame = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.34), new THREE.MeshBasicMaterial({ color: C.knob, side: THREE.DoubleSide })); bigFrame.position.set(bigAt[0], bigAt[1], -0.01); bigFrame.visible = false; scene.add(bigFrame);

  // the first-row weights of four neurons as pictures: gold where a lit pixel pushes the neuron up, purple where it pushes it down
  const PX0 = 29, PX1 = 33.5, PY = [-3.6, -6.6, -9.6, -12.6], PP8 = 0.3;
  const pic = (cx, cy, vals) => { const m = Math.max(...vals.map(Math.abs)); const q = quads(cx - 1.2, cy + 1.2, 8, 8, PP8, 0.27, (r, c, col) => shade(col, vals[r * 8 + c] >= 0 ? COL.knob : COL.signal, Math.sqrt(Math.abs(vals[r * 8 + c]) / m))); q.visible = false; return q; };
  const picsStart = D.watch.map((_, k) => pic(PX0, PY[k], D.W1_start[k])), picsEnd = D.watch.map((_, k) => pic(PX1, PY[k], D.W1_end[k]));

  // ---------- panels ----------
  const passes = [0, 20, 40, 60];
  const PLR = makePanel({ drawn: true, x0: 0, w: 12, y0: 2, h: 7.5, xmin: 0, xmax: 60, ymin: 0, ymax: 2.5, xt: passes, yt: [0, 1, 2], xName: 'passes over the 3,823 pictures', yName: 'loss on the training pictures, four step sizes', xHue: '#8e99bd', yHue: '#f5b942' });
  const PBT = makePanel({ drawn: true, x0: 18, w: 12, y0: 2, h: 7.5, xmin: 0, xmax: 120, ymin: 1.0, ymax: 2.45, xt: [0, 40, 80, 120], yt: [1, 1.5, 2], xName: `the ${D.steps_per_pass} steps of the first pass, ${D.batch} pictures each`, yName: 'loss on the batch', xHue: '#8e99bd', yHue: '#fb7185' });
  const PLS = makePanel({ drawn: true, x0: -31, w: 12, y0: -14, h: 7, xmin: 0, xmax: 60, ymin: 0, ymax: 2.4, xt: passes, yt: [0, 1, 2], xName: 'loss on the training pictures, per pass', yName: '', xHue: '#fb7185', yHue: '#fb7185' });
  const PAC = makePanel({ drawn: true, x0: -16, w: 12, y0: -14, h: 7, xmin: 0, xmax: 60, ymin: 0, ymax: 100, xt: passes, yt: [0, 50, 100], yf: v => v + '%', xName: 'right answers, per pass: training pictures (teal) · test pictures (blue)', yName: '', xHue: '#5eead4', yHue: '#5eead4' });
  const PSM = makePanel({ drawn: true, x0: 0.5, w: 10, y0: -14, h: 7, xmin: 0, xmax: 60, ymin: 0, ymax: 100, xt: passes, yt: [0, 50, 100], yf: v => v + '%', xName: 'score for the right digit: the 3 · the 8 · the 7', yName: '', xHue: '#8e99bd', yHue: '#8e99bd' });
  const PKN = makePanel({ drawn: true, x0: 13, w: 12, y0: -14, h: 7, xmin: 0, xmax: D.n_steps, ymin: 0, ymax: 1.6, xt: [0, 3600, 7200], xf: v => n(v), yt: [0, 0.5, 1, 1.5], xName: `knob A (hidden ${D.A[0]} → score ${D.A[1]}) over the ${n(D.n_steps)} steps`, yName: `its slope ${f4(F.start_knobA_slope)} → ${f4(LAST.knobA_slope)} · mean of all ${n(F.n_knobs)}: ${f4(F.start_mean_abs_slope)} → ${f4(LAST.mean_abs_slope)}`, xHue: '#f5b942', yHue: '#f5b942' });
  const lossPts = key => [[0, D.untrained_loss], ...R[key].train_loss.map((v, i) => [i + 1, Math.min(v, 2.45)])];
  const LR = { '0.005': PLR.add(lossPts('0.005'), C.muted), '0.05': PLR.add(lossPts('0.05'), C.knob, 0.03), '0.5': PLR.add(lossPts('0.5'), C.output), '2.0': PLR.add(lossPts('2.0'), C.bad) };
  const batchLine = PBT.add(D.batch_losses.map((v, i) => [i + 1, v]), C.bad), batchDot = PBT.dot(C.knob, 0.16); batchDot.position.set(PBT.px(120), PBT.py(PP[0].train_loss), 0.05);
  const lossLine = PLS.add([[0, D.untrained_loss], ...PP.map(r => [r.pass, r.train_loss])], C.bad);
  const accTr = PAC.add([[0, F.start_train_acc * 100], ...PP.map(r => [r.pass, r.train_acc * 100])], C.output), accTe = PAC.add([[0, F.start_test_acc * 100], ...PP.map(r => [r.pass, r.test_acc * 100])], C.input);
  const smp = [C.output, C.input, C.bad].map((c, k) => PSM.add(D.samples_p.map((v, i) => [i, v[k] * 100]), c));
  const knobLine = PKN.add([[0, F.knobA_w], ...D.knobA_path.map((v, i) => [(i + 1) * D.knobA_path_stride, v])], C.knob);
  const drawAnim = (l, dur, at) => anim(t => drawTo(l, t), dur, at, easeInOut);

  // ---------- labels on the scene ----------
  const tl = {
    h1: mk('#8e99bd', FX1 + 6.5, 10.1, 'head'), h2: mk('#8e99bd', FX2 + 3.3, 10.1, 'head'), h3: mk('#8e99bd', FX3 + 1.7, 10.1, 'head'),
    bigLab: mk('#f5b942', bigAt[0] + 0.5, bigAt[1], 'tag left'), rule: mk('#f5b942', -24, 2.2, 'tag mono big'), big1: mk('#f5b942', -9.5, 1.2, 'tag mono'), lossTag: mk('#fb7185', -24, 1.2, 'tag mono'), legend: mk('#8e99bd', -9.5, 2.2, 'tag'),
    l005: mk('#8e99bd', PLR.px(60) + 0.3, PLR.py(R['0.005'].train_loss[59]) + 0.35, 'tag mono left'), l05: mk('#f5b942', PLR.px(60) + 0.3, PLR.py(R['0.05'].train_loss[59]) - 0.1, 'tag mono left'),
    l5: mk('#5eead4', PLR.px(60) + 0.3, PLR.py(R['0.5'].train_loss[59]) - 0.8, 'tag mono left'), l2: mk('#fb7185', PLR.px(60) + 0.3, PLR.py(2.45), 'tag mono left'),
    bt1: mk('#fb7185', PBT.px(88), PBT.py(2.25), 'tag'), bt2: mk('#f5b942', PBT.px(120) + 0.3, PBT.py(PP[0].train_loss), 'tag mono left'),
    ls0: mk('#fb7185', PLS.px(0) + 0.3, PLS.py(D.untrained_loss) + 0.35, 'tag mono left'), ls1: mk('#fb7185', PLS.px(60) + 0.3, PLS.py(LAST.train_loss) + 0.35, 'tag mono left'),
    acTr: mk('#5eead4', PAC.px(60) - 0.2, PAC.py(100) + 0.45, 'tag mono right'), acTe: mk('#4fd1ff', PAC.px(60) - 0.2, PAC.py(LAST.test_acc * 100) - 0.6, 'tag mono right'),
    sm38: mk('#5eead4', PSM.px(30), PSM.py(100) + 0.45, 'tag mono'), sm7: mk('#fb7185', PSM.px(30), PSM.py(0) + 0.55, 'tag mono'),
    kn0: mk('#f5b942', PKN.px(0) + 0.3, PKN.py(F.knobA_w) - 0.45, 'tag mono left'), kn1: mk('#f5b942', PKN.px(D.n_steps) - 0.2, PKN.py(LAST.knobA) + 0.45, 'tag mono right'), knBowl: mk('#8e99bd', PKN.px(4000), PKN.py(0.55), 'tag'),
    hStart: mk('#8e99bd', PX0, -1.6, 'head'), hEnd: mk('#8e99bd', PX1, -1.6, 'head'), rows: D.watch.map((j, k) => mk('#8e99bd', PX0 - 2.0, PY[k], 'tag right')), picLegend: mk('#8e99bd', (PX0 + PX1) / 2, -14.9, 'tag'),
    loop: mk('#5eead4', 2.5, 12.4, 'tag big', 20)
  };
  say(tl.h1, '64 → 32, + bias'); say(tl.h2, '32 → 16'); say(tl.h3, '16 → 10'); say(tl.bigLab, `steepest: bias of score ${F.big.at[0]}`);
  say(tl.rule, `new = old − ${D.lr} × slope`); say(tl.big1, `bias of score ${F.big.at[0]}: ${F.big.w} − ${D.lr} × (${f4(F.big.slope)}) = ${f4(F.big.after)}`); say(tl.lossTag, `loss on these ${D.batch} pictures: ${f4(F.loss_before)} → ${f4(F.loss_after)}`);
  say(tl.legend, `${n(F.n_knobs)} slopes from ${D.batch} pictures · teal: turn up · pink: turn down · brightness: size`);
  say(tl.l005, `0.005: ${f4(R['0.005'].train_loss[59])}`); say(tl.l05, `0.05: ${f4(R['0.05'].train_loss[59])}`); say(tl.l5, `0.5: ${f4(R['0.5'].train_loss[59])}`); say(tl.l2, `2: loss ≈ ${Math.round(R['2.0'].train_loss[59])}, right ${pct1(R['2.0'].test_acc[59])}`);
  say(tl.bt1, 'rough slopes, small steps'); say(tl.bt2, `after the pass, all ${n(D.n_train)}: ${f4(PP[0].train_loss)}`);
  say(tl.ls0, f4(D.untrained_loss)); say(tl.ls1, f4(LAST.train_loss)); say(tl.acTr, `training ${pct1(LAST.train_acc)}`); say(tl.acTe, `test ${pct1(LAST.test_acc)}`);
  const sp0 = D.samples_p[0], sp1 = D.samples_p[60];
  say(tl.sm38, `the 3: ${pct1(sp0[0])} → ${pct1(sp1[0])} · the 8: ${pct1(sp0[1])} → ${pct2(sp1[1])}`); say(tl.sm7, `the 7: ${pct1(sp0[2])} → ${pct2(sp1[2])}, still wrong`);
  say(tl.kn0, f4(F.knobA_w)); say(tl.kn1, f4(LAST.knobA)); say(tl.knBowl, `fast at first, then slower: the slope shrinks`);
  say(tl.hStart, 'at the start'); say(tl.hEnd, 'trained'); tl.rows.forEach((L, k) => say(L, `neuron ${D.watch[k]}`)); say(tl.picLegend, 'gold: a lit pixel pushes up · purple: down<br>brightness scaled per picture');
  say(tl.loop, `forward · loss · backward · step &nbsp;×&nbsp; ${n(D.n_steps)}`);

  // ---------- tiny tween engine ----------

  // ---------- the steps ----------
  const S1 = [-33, -3.5, 0.4, 11.2], S2 = [-1.6, 14.2, -0.3, 11.2], S3 = [16.4, 32.2, -0.3, 11.2], S4 = [-32.5, 12, -16.2, -0.8], S5 = [11.4, 26.2, -16.2, -0.8], S6 = [24.5, 37.5, -16.2, -0.8], S7 = [-33, 38, -16.5, 13.3];
  const steps = [
    { dur: 19, title: 'Turn every knob against its slope', box: S1, yaw: 0,
      text: `Pill 09 gave every knob a slope: how the loss moves if that knob turns up. The rule that trains the network is one line: new = old − step × slope. Minus, because a negative slope means the loss falls as the knob rises, so up it goes; a positive slope, down. All ${n(F.n_knobs)} at once. Here is step one, at the random start, with ${D.batch} training pictures. The steepest knob is the bias of score ${F.big.at[0]}, slope ${f4(F.big.slope)}, since seven of the ${D.batch} are twos: it moves from ${F.big.w} to ${f4(F.big.after)}. Knob A’s slope on these ${D.batch} is only ${f4(F.knobA_slope)}; it barely moves. The loss on the ${D.batch} pictures: ${f4(F.loss_before)} before the step, ${f4(F.loss_after)} after. Downhill, a little.`,
      line: `new = old − ${D.lr} × slope · step 1 of ${n(D.n_steps)}: ${D.batch} pictures, ${n(F.n_knobs)} knobs · loss on them ${f4(F.loss_before)} → ${f4(F.loss_after)}` },
    { dur: 20, title: 'The step size', box: S2, yaw: 0,
      text: `The ${D.lr} is the step size, the one number of the recipe that nothing learns. A slope is true only near the knob, pill 08’s bowl is not a line, so steps must stay small. Too small and little happens: at 0.005 the loss is still ${f4(R['0.005'].train_loss[59])} after 60 passes. Ten times larger, ${D.lr}, the run on screen, reaches ${f4(R['0.05'].train_loss[59])}. At 0.5, larger again, ${f4(R['0.5'].train_loss[59])}: faster still. At 2 the knobs overshoot the bottom at every step and never come down: the loss sits around ${Math.round(R['2.0'].train_loss[59])} and the network is right ${pct1(R['2.0'].test_acc[59])} of the time, chance. Bigger is faster until it is not, and the only way to find the edge is to try.`,
      line: `step size: 0.005 → loss ${f4(R['0.005'].train_loss[59])} · ${D.lr} → ${f4(R['0.05'].train_loss[59])} · 0.5 → ${f4(R['0.5'].train_loss[59])} · 2 → ≈ ${Math.round(R['2.0'].train_loss[59])}, chance` },
    { dur: 19, title: 'A few pictures at a time', box: S3, yaw: 0,
      text: `Why ${D.batch} pictures and not all ${n(D.n_train)}? The slope over all of them is the honest one, but it costs a full pass for a single step. The slope over ${D.batch} is a rough estimate that costs a hundredth, cheap enough to take ${D.steps_per_pass} steps per pass over the pictures, and rough is fine: each step is small, and the next batch corrects the last. The loss on each batch jumps around on its way down. After one pass over every picture, one epoch, the average loss has fallen from ${f4(D.untrained_loss)} to ${f4(PP[0].train_loss)}, and the network already reads ${pct1(PP[0].test_acc)} of the test pictures.`,
      line: `${D.batch} pictures per step · ${D.steps_per_pass} steps per pass · after pass 1: loss ${f4(PP[0].train_loss)}, test ${pct1(PP[0].test_acc)}` },
    { dur: 21, title: 'Watch it fall', box: S4, yaw: 0,
      text: `${D.epochs} passes, ${n(D.n_steps)} steps. The loss on the training pictures: ${f4(D.untrained_loss)} at the start, ${f4(PP[0].train_loss)} after one pass, ${f4(PP[9].train_loss)} after ten, ${f4(LAST.train_loss)} at the end. The right answers climb the other way: ${pct1(LAST.train_acc)} of the training pictures, ${pct1(LAST.test_acc)} of the ${n(D.n_test)} test pictures it never trained on, the number of pill 03. The three pictures of pill 03 along the way: the 3’s score for 3 goes from ${pct1(sp0[0])} to ${pct1(sp1[0])}, the 8’s from ${pct1(sp0[1])} to ${pct2(sp1[1])}, and the 7’s score for 7 from ${pct1(sp0[2])} to ${pct2(sp1[2])}. That one stays wrong, and its loss says so.`,
      line: `loss per pass: ${f4(D.untrained_loss)} → ${f4(PP[0].train_loss)} → ${f4(PP[9].train_loss)} (10) → ${f4(LAST.train_loss)} (60) · right: training ${pct1(LAST.train_acc)}, test ${pct1(LAST.test_acc)}` },
    { dur: 19, title: 'The knobs settle', box: S5, yaw: 0,
      text: `Knob A, hidden ${D.A[0]} into score ${D.A[1]}, walks from ${f4(F.knobA_w)} to ${f4(LAST.knobA)}: fast at first, then slower, as its slope shrinks from ${f4(F.start_knobA_slope)} to ${f4(LAST.knobA_slope)}. Across all ${n(F.n_knobs)} knobs the mean slope falls from ${f4(F.start_mean_abs_slope)} to ${f4(LAST.mean_abs_slope)}, pill 08’s two fields. That is what trained means: not that every knob reached a bottom, but that the slopes are small enough that further steps barely move anything. Pill 07’s bowl had its bottom for knob A at 2.27; the walk stopped near it, not on it. Sixty passes was the budget.`,
      line: `knob A: ${f4(F.knobA_w)} → ${f4(LAST.knobA)} · its slope ${f4(F.start_knobA_slope)} → ${f4(LAST.knobA_slope)} · mean slope of all knobs ${f4(F.start_mean_abs_slope)} → ${f4(LAST.mean_abs_slope)}` },
    { dur: 18, title: 'What the knobs became', box: S6, yaw: 0,
      text: `Nobody wrote a rule for reading digits. A first-row neuron owns 64 weights, one per pixel, so they can be drawn as a picture: gold where a lit pixel pushes the neuron up, purple where it pushes it down. At the start, noise, the random numbers of pill 08. After ${n(D.n_steps)} steps, each neuron has settled into a pattern of strokes and gaps that nobody designed: the slopes did it, one small step at a time. Neuron ${D.watch[0]}, the one of pills 05 to 10, is among them.`,
      line: `first-row weights as pictures: ${D.watch.length} neurons, before and after · 64 numbers each · shaped by ${n(D.n_steps)} steps` },
    { dur: 16, title: 'The recipe, complete', box: S7, yaw: 0,
      text: `Forward: every value. The loss: one number. Backward: every slope. Step: every knob, a little, against its slope. ${n(D.n_steps)} times, and a reader of handwritten digits stands where a random start was. Everything larger is this loop with more knobs and more pictures. Pill 12 puts the standard names on the pieces seen so far. Part 2 builds the engine behind the backward pass by hand, in about a hundred lines.`,
      line: `forward · loss · backward · step, × ${n(D.n_steps)} · ${n(D.n_test)} test pictures: ${pct1(LAST.test_acc)} right` }
  ];

  // deterministic resting state at the start of step i
  function baseState(i) {
    clearAnims();
    const dimOn = (lab, on, hot) => state(lab, on ? (hot ? 'on' : 'dim') : '');
    const lineOn = (l, on, hot, color) => { l.visible = on; drawTo(l, 1); l.material.color.setHex(hot ? color : C.dim); };
    field.forEach(m => { m.visible = true; m.material.opacity = i === 0 ? 1 : 0.45; }); bigFrame.visible = true; bigFrame.material.color.setHex(i === 0 ? C.knob : C.dim);
    for (const k of ['h1', 'h2', 'h3', 'bigLab', 'rule', 'big1', 'lossTag', 'legend']) dimOn(tl[k], true, i === 0);
    PLR.show(i >= 1 ? 1 : 0); if (PLR.g.visible) for (const L of [PLR.xName, PLR.yName]) state(L, i === 1 ? 'on' : 'dim');
    lineOn(LR['0.005'], i >= 1, i === 1, C.muted); lineOn(LR['0.05'], i >= 1, i === 1, C.knob); lineOn(LR['0.5'], i >= 1, i === 1, C.output); lineOn(LR['2.0'], i >= 1, i === 1, C.bad);
    for (const k of ['l005', 'l05', 'l5', 'l2']) dimOn(tl[k], i >= 1, i === 1);
    PBT.show(i >= 2 ? 1 : 0); if (PBT.g.visible) for (const L of [PBT.xName, PBT.yName]) state(L, i === 2 ? 'on' : 'dim');
    lineOn(batchLine, i >= 2, i === 2, C.bad); batchDot.visible = i >= 2; batchDot.material.color.setHex(i === 2 ? C.knob : C.dim); batchDot.material.emissive.copy(batchDot.material.color); batchDot.scale.setScalar(1);
    dimOn(tl.bt1, i >= 2, i === 2); dimOn(tl.bt2, i >= 2, i === 2);
    for (const P of [PLS, PAC, PSM]) { P.show(i >= 3 ? 1 : 0); if (P.g.visible) state(P.xName, i === 3 ? 'on' : 'dim'); }
    lineOn(lossLine, i >= 3, i === 3, C.bad); lineOn(accTr, i >= 3, i === 3, C.output); lineOn(accTe, i >= 3, i === 3, C.input); [C.output, C.input, C.bad].forEach((c, k) => lineOn(smp[k], i >= 3, i === 3, c));
    for (const k of ['ls0', 'ls1', 'acTr', 'acTe', 'sm38', 'sm7']) dimOn(tl[k], i >= 3, i === 3);
    PKN.show(i >= 4 ? 1 : 0); if (PKN.g.visible) for (const L of [PKN.xName, PKN.yName]) state(L, i === 4 ? 'on' : 'dim');
    lineOn(knobLine, i >= 4, i === 4, C.knob); for (const k of ['kn0', 'kn1', 'knBowl']) dimOn(tl[k], i >= 4, i === 4);
    [...picsStart, ...picsEnd].forEach(m => { m.visible = i >= 5; m.material.opacity = i === 5 ? 1 : 0.45; m.scale.setScalar(1); });
    for (const L of [tl.hStart, tl.hEnd, tl.picLegend, ...tl.rows]) dimOn(L, i >= 5, i === 5);
    dimOn(tl.loop, i >= 6, i === 6);
  }

  const enter = [
    () => { field.forEach(m => { m.visible = false; }); bigFrame.visible = false; for (const k of ['h1', 'h2', 'h3', 'bigLab', 'rule', 'big1', 'lossTag', 'legend']) state(tl[k], '');
      on(tl.rule, 0.6); fadeIn(field[0], 0.8, 2.0); on(tl.h1, 2.4); fadeIn(field[1], 0.8, 3.2); on(tl.h2, 3.6); fadeIn(field[2], 0.8, 4.4); on(tl.h3, 4.8); on(tl.legend, 6.0);
      later(() => { bigFrame.visible = true; pulse(bigFrame, 0.8, 0); state(tl.bigLab, 'on'); }, 8.0); on(tl.big1, 9.4); on(tl.lossTag, 13.0); },
    () => { PLR.show(0); anim(a => PLR.show(a), 0.8, 0.4); Object.values(LR).forEach(l => drawTo(l, 0)); for (const k of ['l005', 'l05', 'l5', 'l2']) state(tl[k], '');
      drawAnim(LR['0.05'], 2.4, 1.6); on(tl.l05, 4.2); drawAnim(LR['0.005'], 2.4, 5.6); on(tl.l005, 8.2); drawAnim(LR['0.5'], 2.4, 9.6); on(tl.l5, 12.2); drawAnim(LR['2.0'], 2.4, 13.6); on(tl.l2, 16.2); },
    () => { PBT.show(0); anim(a => PBT.show(a), 0.8, 0.4); drawTo(batchLine, 0); batchDot.visible = false; state(tl.bt1, ''); state(tl.bt2, '');
      drawAnim(batchLine, 5.0, 1.6); on(tl.bt1, 4.5); later(() => { batchDot.visible = true; pulse(batchDot, 0.8, 0); state(tl.bt2, 'on'); }, 7.2); },
    () => { for (const P of [PLS, PAC, PSM]) P.show(0); [lossLine, accTr, accTe, ...smp].forEach(l => drawTo(l, 0)); for (const k of ['ls0', 'ls1', 'acTr', 'acTe', 'sm38', 'sm7']) state(tl[k], '');
      anim(a => PLS.show(a), 0.8, 0.4); on(tl.ls0, 1.2); drawAnim(lossLine, 3.0, 1.4); on(tl.ls1, 4.6);
      anim(a => PAC.show(a), 0.8, 5.4); drawAnim(accTr, 3.0, 6.2); drawAnim(accTe, 3.0, 6.6); on(tl.acTr, 9.6); on(tl.acTe, 10.0);
      anim(a => PSM.show(a), 0.8, 11.0); smp.forEach((l, k) => drawAnim(l, 3.0, 11.8 + 0.3 * k)); on(tl.sm38, 15.4); on(tl.sm7, 16.4); },
    () => { PKN.show(0); anim(a => PKN.show(a), 0.8, 0.4); drawTo(knobLine, 0); for (const k of ['kn0', 'kn1', 'knBowl']) state(tl[k], '');
      on(tl.kn0, 1.2); drawAnim(knobLine, 4.0, 1.4); on(tl.knBowl, 4.0); on(tl.kn1, 5.8); },
    () => { [...picsStart, ...picsEnd].forEach(m => { m.visible = false; }); for (const L of [tl.hStart, tl.hEnd, tl.picLegend, ...tl.rows]) state(L, '');
      on(tl.hStart, 0.6); picsStart.forEach((m, k) => { fadeIn(m, 0.6, 1.0 + 0.4 * k); on(tl.rows[k], 1.0 + 0.4 * k); }); on(tl.hEnd, 4.0); picsEnd.forEach((m, k) => fadeIn(m, 0.8, 4.4 + 0.7 * k)); on(tl.picLegend, 8.6); },
    () => { state(tl.loop, ''); on(tl.loop, 1.2); }
  ];

  // ---------- ledger ----------
  const ledgerEl = document.getElementById('ledger');
  function renderLedger(i) {
    ledgerEl.innerHTML = '<div class="ln title">the run so far</div>';
    for (let k = 0; k <= i; k++) { if (!steps[k].line) continue; const d = document.createElement('div'); d.className = 'ln' + (k === i ? ' now' : ''); d.innerHTML = steps[k].line; ledgerEl.appendChild(d); }
  }

  // ---------- camera ----------

  K.run({ steps, enter, baseState, ledger: renderLedger });
})();
</script>
</body>
