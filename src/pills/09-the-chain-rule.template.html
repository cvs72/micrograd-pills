<title>The Chain Rule</title>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>

  #title { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 3vw, 30px); line-height: 1.1; text-wrap: balance; margin: 0; grid-column: 1; }

<div id="stage"></div>
<div id="labels"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  const N1 = nodes(32, pos1, 0.14), N2 = nodes(16, pos2, 0.19), N3 = nodes(10, pos3, 0.22);

  // highlighted wires: thin tubes that can grow from their start

    knobA: tube(pos2(KA.hidden), pos3(KA.score), 0.05, C.knob), score7: tube(pos3(KA.score), posL, 0.05, C.bad),
    fan14: fan(pos2(BR.neuron), Array.from({ length: 10 }, (_, m) => pos3(m)), 0.03, C.signal), knobB: tube(pos1(BR.from), pos2(BR.neuron), 0.05, C.knob),

    big: mk('#fb7185', PB.px(KA.score), PB.py(BR.terms[KA.score]) + 0.5, 'tag mono'), ring14: mk('#c084fc', X2 - 0.45, p14[1], 'tag right'), inB: mk('#f5b942', mB[0] - 1.0, mB[1] - 0.65, 'tag mono'),
    bl7: mk('#fb7185', X3 + 0.4, p7[1] + 0.55, 'tag mono left'), bl9: mk('#fb7185', X3 + 0.4, pos3(9)[1] + 0.55, 'tag mono left'), bl14: mk('#fb7185', X2 - 0.45, p14[1] - 0.6, 'tag mono right'),
    bl10: mk('#5eead4', X1 - 0.4, p1[1] + 1.15, 'tag mono right'), chain: mk('#5eead4', X1 - 0.6, -4.1, 'tag mono right'), blame: mk('#8e99bd', 6.5, -5.6, 'tag'),
    fwd: mk('#5eead4', (PICX + XL) / 2, 7.85, 'tag'), bwd: mk('#fb7185', (PICX + XL) / 2, -7.85, 'tag')
  };
  say(tl.pic, 'the 7 · the random start'); say(tl.h1, '32 neurons'); say(tl.h2, '16 neurons'); say(tl.h3, '10 scores'); say(tl.loss, `loss ${f4(CH.loss)}`);
  say(tl.pixel, `pixel ${K1.pixel}: ${f3(K1.x)}`); say(tl.neuron, `neuron ${K1.neuron}`); say(tl.nudged, `nudged: ${f5(K1.nudged)}`); say(tl.paths, `${K1.paths} paths from neuron ${K1.neuron} to the loss`);
  say(tl.step1, `× ${f3(K1.x)} (input)`); say(tl.tan, `slope here: ${f4(K1.squash_slope)}`);
  say(tl.last, `× (${f4(KA.p)} − 1) = ${f4(KA.score_slope)}`); say(tl.score7, `score ${KA.score}: ${pct(KA.p)}`); say(tl.inA, `× ${f4(KA.h)} (input: hidden ${KA.hidden})`);
  say(tl.big, `via ${KA.score}: ${f4(BR.weights[KA.score])} × ${f4(CH.g3[KA.score])} = ${f4(BR.terms[KA.score])}`); say(tl.ring14, `neuron ${BR.neuron}`); say(tl.inB, `× ${f4(BR.input)}`);
  say(tl.bl7, `blame ${f4(CH.g3[KA.score])}`); say(tl.bl9, `blame ${sg4(CH.g3[9])}`); say(tl.bl14, `blame ${f4(BR.blame_z)}`); say(tl.bl10, `blame ${f5(K1.blame_z)}`);
  say(tl.chain, `chain: ${f5(K1.blame_z)} × ${f3(K1.x)} = ${f5(K1.chain)}`); say(tl.blame, 'the blame of every neuron');
  say(tl.fwd, 'forward: one pass, every value'); say(tl.bwd, `backward: one walk, every slope, all ${n(CH.n_knobs)}`);
  const ring14 = new THREE.Mesh(new THREE.RingGeometry(0.28, 0.36, 32), new THREE.MeshBasicMaterial({ color: C.signal, side: THREE.DoubleSide })); ring14.position.set(p14[0], p14[1], 0.05); ring14.visible = false; scene.add(ring14);

  // blame colours: teal when the loss falls as the neuron's sum grows, pink when it rises; brightness by size within the row
  const colNode = (m, g, gmax) => { const a = Math.sqrt(Math.min(1, Math.abs(g) / gmax)); m.material.color.setHex(C.node).lerp(new THREE.Color(g < 0 ? C.output : C.bad), a); m.material.emissive.copy(m.material.color); m.material.emissiveIntensity = 0.35 + 0.6 * a; };
  const resetNode = m => { m.material.color.setHex(C.node); m.material.emissive.setHex(C.node); m.material.emissiveIntensity = 0.35; };
  const gmax = [Math.max(...CH.g1.map(Math.abs)), Math.max(...CH.g2.map(Math.abs)), Math.max(...CH.g3.map(Math.abs))];
  function blameRows(upTo) { N3.forEach((m, i) => upTo >= 1 ? colNode(m, CH.g3[i], gmax[2]) : resetNode(m)); N2.forEach((m, i) => upTo >= 2 ? colNode(m, CH.g2[i], gmax[1]) : resetNode(m)); N1.forEach((m, i) => upTo >= 3 ? colNode(m, CH.g1[i], gmax[0]) : resetNode(m)); }

  // ---------- tiny tween engine ----------
  const anims = []; let now = 0;
  const easeOut = t => 1 - Math.pow(1 - t, 3), easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, linear = t => t;
  function anim(fn, dur, delay, ease) { anims.push({ fn, start: now + (reduced ? 0 : (delay || 0)), dur: reduced ? 0.01 : dur, ease: ease || easeOut, done: false }); }
  const lerp = (a, b, t) => a + (b - a) * t;
  // a tube keeps its length (scale.y) and swells in radius only
  function pulse(mesh, dur, delay) { const s = mesh.scale.x; anim(t => { if (mesh.set) { const g = s * (1 + 1.5 * Math.sin(Math.PI * t)); mesh.scale.x = g; mesh.scale.z = g; } else mesh.scale.setScalar(s * (1 + 0.3 * Math.sin(Math.PI * t))); }, dur, delay); }
  function later(fn, s) { anim(t => { if (t >= 1) fn(); }, 0.01, s, linear); }
  function draw(line, k) { line.geometry.setDrawRange(0, Math.max(line.geometry.drawRange.count, k + 1)); }
  const growT = (tb, dur, at) => anim(t => tb.set(t), dur, at);
  const growAll = (ts, dur, at, stagger) => ts.forEach((tb, i) => growT(tb, dur, at + (stagger || 0) * i));
  const on = (lab, at) => later(() => state(lab, 'on'), at);
  function stepAnims() { for (const a of anims) { if (a.done) continue; const t = (now - a.start) / a.dur; if (t < 0) continue; const k = Math.min(1, t); a.fn(a.ease(k)); if (k >= 1) a.done = true; } for (let i = anims.length - 1; i >= 0; i--) if (anims[i].done) anims.splice(i, 1); }
  function clearAnims() { anims.length = 0; }

  // ---------- the steps ----------
  const S1 = [PICX - 2.6, XL + 2.2, -7.0, 7.0], S2 = [PICX - 2.6, 23.2, -7.4, 8.2], S3 = [-4.5, 23.2, -7.4, 8.2], S4 = [-5.5, 26.5, -10.4, 7.4], S5 = [PICX - 2.6, XL + 2.2, -7.4, 7.4], S6 = [PICX - 2.6, XL + 2.2, -8.7, 8.7];
  const steps = [
    { dur: 18, title: 'A knob far from the loss', box: S1, yaw: -0.04,
      text: `The random start again, reading the 7: the score for 7 is ${pct(KA.p)}, the loss ${f4(CH.loss)}. Pick the knob of pill 05, pixel ${K1.pixel} into neuron ${K1.neuron} of the first row, at ${f3(K1.w)}. Between it and the loss sit neuron ${K1.neuron}’s squash, 16 neurons of the second row, 10 scores and the loss itself: ${K1.paths} paths. Nudging this knob and measuring the 7’s loss again gives its slope, ${f5(K1.nudged)}, at the price of a whole extra pass. The question of this pill: the same number from the slopes of the single steps, with no nudge at all.`,
      line: `the 7 at the start: score for 7 ${pct(KA.p)} · loss ${f4(CH.loss)} · knob pixel ${K1.pixel} → neuron ${K1.neuron}: nudged slope ${f5(K1.nudged)}` },
    { dur: 19, title: 'Slopes multiply along a path', box: S2, yaw: 0,
      text: `Start at the knob. Its first step is the sum: z of neuron ${K1.neuron} moves ${f3(K1.x)} per unit of the knob, the input on the wire, as pill 08 showed. The second step is the squash: at z = ${f3(K1.z)} the S-curve has slope ${f4(K1.squash_slope)}. Nudge the knob by a hair, d. Then z moves ${f3(K1.x)} d, and the squash output moves ${f4(K1.squash_slope)} × ${f3(K1.x)} d = ${f4(K1.squash_slope * K1.x)} d. Slopes multiply, like gears: if the first turns the second at ${f3(K1.x)} per turn and the second turns the third at ${f4(K1.squash_slope)}, the first turns the third at their product. That is the chain rule, all of it. Each step needs to know only its own slope.`,
      line: `w → z: × ${f3(K1.x)} · z → h: × ${f4(K1.squash_slope)} · w → h: × ${f4(K1.squash_slope * K1.x)}` },
    { dur: 19, title: 'The last two steps', box: S3, yaw: 0.04,
      text: `Now the far end, where every path arrives. The final step, score ${KA.score} into the loss, has a slope that the maths of −log and softmax makes simple: the score minus its target. For the right digit, ${f4(KA.p)} − 1 = ${f4(KA.score_slope)}; for a wrong digit it is the score itself. One step before it, knob A of pill 08 feeds score ${KA.score} from hidden neuron ${KA.hidden}, whose output is ${f4(KA.h)}: that input is the slope. Multiply: ${f4(KA.h)} × (${f4(KA.score_slope)}) = ${f4(KA.chain)}, the slope of this picture’s loss against knob A. Nudging says ${f4(KA.nudged)}. Two local slopes, one multiplication, no nudge.`,
      line: `score ${KA.score} → loss: × (${f4(KA.p)} − 1) = ${f4(KA.score_slope)} · knob A: ${f4(KA.h)} × ${f4(KA.score_slope)} = ${f4(KA.chain)} · nudged ${f4(KA.nudged)}` },
    { dur: 21, title: 'Paths add', box: S4, yaw: 0.06,
      text: `A hidden neuron is not on one path. Neuron ${BR.neuron} of the second row feeds all 10 scores, so a nudge to its output reaches the loss ten ways at once. Along each path, multiply: the wire’s weight times that score’s slope. Ten products, most of them small, one large through score ${KA.score}: ${f4(BR.weights[KA.score])} × (${f4(CH.g3[KA.score])}) = ${f4(BR.terms[KA.score])}. Across paths, add: ${f4(BR.sum)}, the slope of the loss against neuron ${BR.neuron}’s output. Back through its own squash, × ${f4(BR.squash_slope)}, gives ${f4(BR.blame_z)}, its blame. One knob into it, from neuron ${BR.from} of the first row with input ${f4(BR.input)}: slope ${f4(BR.chain)}, and nudging agrees. Multiply along a path, add across paths.`,
      line: `neuron ${BR.neuron}: 10 paths add → ${f4(BR.sum)} · × squash ${f4(BR.squash_slope)} → ${f4(BR.blame_z)} · knob ${BR.from} → ${BR.neuron}: × ${f4(BR.input)} = ${f4(BR.chain)} (nudged ${f4(BR.nudged)})` },
    { dur: 22, title: 'Walk back once', box: S5, yaw: 0,
      text: `Look at the pattern: a neuron’s slope comes only from the row after it. So start at the loss and walk back one row at a time. The 10 scores first: score minus target. Then the 16: add across the 10 paths, times the squash. Then the 32, the same way. Every neuron ends up with one number, its blame. Every knob’s slope is then its neuron’s blame times its input. Pixel ${K1.pixel} into neuron ${K1.neuron}: ${f5(K1.blame_z)} × ${f3(K1.x)} = ${f5(K1.chain)}, the number nudging gave in the first step. One backward walk, all ${n(CH.n_knobs)} slopes. Averaged over the ${n(CH.n_train)} pictures, it is the field of pill 08.`,
      line: `one walk back: 10 → 16 → 32 blames · knob pixel ${K1.pixel} → neuron ${K1.neuron}: ${f5(K1.blame_z)} × ${f3(K1.x)} = ${f5(K1.chain)} · nudged ${f5(K1.nudged)}` },
    { dur: 17, title: 'Why this is the whole trick', box: S6, yaw: 0,
      text: `Count the work. One forward pass gives every value in the network; one backward walk, about the same size, gives every slope. Two passes for ${n(CH.n_knobs)} slopes, where nudging needed ${n(CH.n_knobs + 1)}. And the walk does not care how many knobs there are: ${n(CH.n_knobs)} or two billion, one pass each way. This is the trick that let networks grow, and the last piece of the recipe: a network, a loss, and a slope for every knob. Pill 10 runs the whole of it on one neuron with every number visible; pill 11 trains the digit network with it on screen.`,
      line: `one forward pass + one backward walk ≈ 2 passes · nudging: ${n(CH.n_knobs + 1)} passes · any number of knobs: the same two passes` }
  ];

  // deterministic resting state at the start of step i
  function baseState(i) {
    clearAnims();
    const dimOn = (lab, on, hot) => state(lab, on ? (hot ? 'on' : 'dim') : '');
    const vis = (tb, on, hot, color) => { tb.visible = on; tb.material.color.setHex(hot ? color : C.dim); tb.material.emissive.setHex(hot ? color : C.dim); };
    for (const k of ['pic', 'h1', 'h2', 'h3']) dimOn(tl[k], true, i === 0 || i >= 4);
    dimOn(tl.loss, true, i === 0 || i === 2 || i === 4); dimOn(tl.pixel, true, i === 0); dimOn(tl.neuron, true, i === 0 || i === 1); dimOn(tl.nudged, true, i === 0 || i === 4); dimOn(tl.paths, true, i === 0);
    pixRing.visible = true; pixRing.material.color.setHex(i === 0 || i === 1 || i === 4 ? C.knob : C.dim);
    vis(T.knob1, true, i === 0 || i === 1 || i === 4, C.knob); T.fan10.forEach(t => vis(t, true, i === 0, C.signal)); T.fan2.forEach(t => vis(t, true, i === 0, C.signal)); T.toLoss.forEach(t => vis(t, true, i === 0, C.signal));
    PT.show(i >= 1 ? 1 : 0); L.s.geometry.setDrawRange(0, i >= 1 ? 121 : 0); L.s.material.color.setHex(i === 1 ? C.signal : C.dim); tanAt(1); L.tan.visible = i >= 1; L.tan.material.color.setHex(i === 1 ? C.knob : C.dim); dotT.visible = i >= 1;
    if (PT.g.visible) { state(PT.xName, i === 1 ? 'on' : 'dim'); state(PT.yName, i === 1 ? 'on' : 'dim'); }
    dimOn(tl.step1, i >= 1, i === 1); dimOn(tl.tan, i >= 1, i === 1);
    vis(T.knobA, i >= 2, i === 2, C.knob); vis(T.score7, i >= 2, i === 2, C.bad); dimOn(tl.last, i >= 2, i === 2); dimOn(tl.score7, i >= 2, i === 2); dimOn(tl.inA, i >= 2, i === 2);
    PB.show(i >= 3 ? 1 : 0); if (PB.g.visible) { state(PB.xName, i === 3 ? 'on' : 'dim'); state(PB.yName, i === 3 ? 'on' : 'dim'); }
    bars.forEach(b => { if (i >= 3) { setBar(b, 1); b.material.color.setHex(i === 3 ? (b.userData.v > 0 ? C.bad : C.output) : C.dim); b.material.emissive.copy(b.material.color); } else b.visible = false; });
    T.fan14.forEach(t => vis(t, i >= 3, i === 3, C.signal)); vis(T.knobB, i >= 3, i === 3, C.knob); ring14.visible = i >= 3; ring14.material.color.setHex(i === 3 ? C.signal : C.dim);
    dimOn(tl.big, i >= 3, i === 3); dimOn(tl.ring14, i >= 3, i === 3); dimOn(tl.inB, i >= 3, i === 3);
    blameRows(i >= 4 ? 3 : 0); for (const k of ['bl7', 'bl9', 'bl14', 'bl10', 'chain', 'blame']) dimOn(tl[k], i >= 4, i === 4);
    vis(T.fwd, i >= 5, i === 5, C.output); vis(T.bwd, i >= 5, i === 5, C.bad); fwdHead.visible = i >= 5; bwdHead.visible = i >= 5; dimOn(tl.fwd, i >= 5, i === 5); dimOn(tl.bwd, i >= 5, i === 5);
  }

  const enter = [
    () => { for (const k of ['loss', 'pixel', 'neuron', 'nudged', 'paths']) state(tl[k], ''); pixRing.visible = false; T.knob1.visible = false; for (const t of [...T.fan10, ...T.fan2, ...T.toLoss]) t.visible = false;
      on(tl.loss, 1.0); pulse(lossNode, 0.8, 1.0); later(() => { pixRing.visible = true; pulse(pixRing, 0.8, 0); state(tl.pixel, 'on'); }, 2.6);
      growT(T.knob1, 1.0, 3.6); on(tl.neuron, 4.4); growAll(T.fan10, 0.8, 5.6, 0.04); growAll(T.fan2, 0.9, 7.0, 0.004); growAll(T.toLoss, 0.8, 8.6, 0.05); on(tl.paths, 9.6); on(tl.nudged, 12.0); },
    () => { PT.show(0); anim(a => PT.show(a), 0.9, 0.4); L.s.geometry.setDrawRange(0, 0); L.tan.visible = false; dotT.visible = false; state(tl.step1, ''); state(tl.tan, '');
      later(() => { pulse(T.knob1, 0.8, 0); state(tl.step1, 'on'); }, 1.2);
      anim(t => draw(L.s, Math.round(t * 120)), 2.4, 3.0, easeInOut); later(() => { dotT.visible = true; pulse(dotT, 0.8, 0); }, 5.6); anim(t => tanAt(t), 1.0, 6.4); on(tl.tan, 7.2); },
    () => { T.knobA.visible = false; T.score7.visible = false; for (const k of ['last', 'score7', 'inA']) state(tl[k], '');
      later(() => { pulse(N3[KA.score], 0.8, 0); state(tl.score7, 'on'); }, 1.0); growT(T.score7, 1.0, 2.4); on(tl.last, 3.4); growT(T.knobA, 1.0, 6.0); on(tl.inA, 7.0); later(() => pulse(lossNode, 0.8, 0), 9.0); },
    () => { PB.show(0); anim(a => PB.show(a), 0.9, 1.6); bars.forEach(b => { b.visible = false; }); T.fan14.forEach(t => { t.visible = false; }); T.knobB.visible = false; ring14.visible = false; for (const k of ['big', 'ring14', 'inB']) state(tl[k], '');
      later(() => { ring14.visible = true; pulse(ring14, 0.8, 0); state(tl.ring14, 'on'); }, 0.8); growAll(T.fan14, 0.8, 2.0, 0.08);
      bars.forEach((b, k) => anim(t => setBar(b, t), 0.6, 3.6 + 0.25 * k)); on(tl.big, 6.6); growT(T.knobB, 1.0, 10.0); on(tl.inB, 10.8); },
    () => { blameRows(0); for (const k of ['bl7', 'bl9', 'bl14', 'bl10', 'chain', 'blame']) state(tl[k], '');
      on(tl.blame, 0.8); later(() => { blameRows(1); state(tl.bl7, 'on'); state(tl.bl9, 'on'); }, 2.4); later(() => { blameRows(2); state(tl.bl14, 'on'); }, 5.0); later(() => { blameRows(3); state(tl.bl10, 'on'); }, 7.6);
      later(() => { pulse(T.knob1, 0.8, 0); state(tl.chain, 'on'); }, 10.0); on(tl.nudged, 11.5); },
    () => { T.fwd.visible = false; T.bwd.visible = false; fwdHead.visible = false; bwdHead.visible = false; state(tl.fwd, ''); state(tl.bwd, '');
      growT(T.fwd, 2.0, 1.0); later(() => { fwdHead.visible = true; state(tl.fwd, 'on'); }, 3.0); growT(T.bwd, 2.0, 5.0); later(() => { bwdHead.visible = true; state(tl.bwd, 'on'); }, 7.0); }
  ];

  // ---------- ledger ----------
  const ledgerEl = document.getElementById('ledger');
  function renderLedger(i) {
    ledgerEl.innerHTML = '<div class="ln title">the chain so far</div>';
    for (let k = 0; k <= i; k++) { if (!steps[k].line) continue; const d = document.createElement('div'); d.className = 'ln' + (k === i ? ' now' : ''); d.innerHTML = steps[k].line; ledgerEl.appendChild(d); }
  }

  // ---------- camera ----------
  let curBox = S1;
  function fitRadius(box) {
    const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight, aspect = w / h;
    const pad = w < 640 ? 1.45 : 1.14;
    const halfW = (box[1] - box[0]) / 2 * pad, halfH = (box[3] - box[2]) / 2 * pad, tanV = Math.tan(VFOV / 2 * Math.PI / 180);
    return Math.max(halfH / tanV, halfW / (tanV * aspect), 2);
  }
  function setCamera(s) { curBox = s.box; camRadiusGoal = fitRadius(s.box); camYawGoal = s.yaw; camElevGoal = s.elev || 0.06; camGoal.set((s.box[0] + s.box[1]) / 2, (s.box[2] + s.box[3]) / 2, 0); }

  // ---------- player ----------
  let step = -1, playing = !reduced, stepStart = 0;
  const countEl = document.getElementById('count'), dotsEl = document.getElementById('dots'), playBtn = document.getElementById('play');
  const titleEl = document.getElementById('title'), textEl = document.getElementById('text');
  steps.forEach(() => { const s = document.createElement('span'); s.appendChild(document.createElement('i')); dotsEl.appendChild(s); });
  function go(i, instant) {
    const prev = step;
    step = (i + steps.length) % steps.length; stepStart = now;
    baseState(step);
    titleEl.textContent = steps[step].title; textEl.textContent = steps[step].text; renderLedger(step);
    countEl.textContent = (step + 1) + ' / ' + steps.length;
    [...dotsEl.children].forEach((d, k) => { d.classList.toggle('done', k < step); d.firstChild.style.width = k === step ? '0%' : ''; });
    layout(); setCamera(steps[step]);
    if (instant) { camRadius = camRadiusGoal; camYaw = camYawGoal; camElev = camElevGoal; camTarget.copy(camGoal); }
    if (prev < 0 || prev === step - 1) enter[step]();
  }
  function setPlaying(p) { playing = p; playBtn.textContent = p ? 'Pause' : 'Play'; }
  document.getElementById('next').onclick = () => go(step + 1);
  document.getElementById('prev').onclick = () => go(step - 1);
  playBtn.onclick = () => setPlaying(!playing);
  window.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1); else if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); } });

  function layout() {
    const h = Math.max(160, window.innerHeight - deck.offsetHeight);
    stage.style.height = h + 'px'; labelsEl.style.height = h + 'px';
    const w = stage.clientWidth; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    if (step >= 0) camRadiusGoal = fitRadius(curBox);
  }
  window.addEventListener('resize', layout);

  let last = performance.now();
  function frame(tms) {
    const dt = Math.min(document.hidden ? 1 : 0.05, (tms - last) / 1000); last = tms; now += dt;
    if (playing) { const el = now - stepStart, d = steps[step].dur; dotsEl.children[step].firstChild.style.width = Math.min(100, 100 * el / d) + '%'; if (el >= d) { if (step === steps.length - 1) setPlaying(false); else go(step + 1); } }
    stepAnims();
    const k = reduced ? 1 : 1 - Math.pow(0.03, dt);
    camRadius = lerp(camRadius, camRadiusGoal, k); camYaw = lerp(camYaw, camYawGoal, k); camElev = lerp(camElev, camElevGoal, k); camTarget.lerp(camGoal, k);
    const drift = reduced ? 0 : Math.sin(now * 0.2) * 0.02;
    camera.position.set(camTarget.x + Math.sin(camYaw + drift) * camRadius, camTarget.y + camRadius * camElev, camTarget.z + Math.cos(camYaw + drift) * camRadius);
    camera.lookAt(camTarget);
    placeLabels();
    renderer.render(scene, camera);
    schedule(frame);
  }
  function schedule(fn) { if (document.hidden) setTimeout(() => fn(performance.now()), 33); else requestAnimationFrame(fn); }
  // preview hook (?debug): fast-forward the current step by `secs` of animation time and render once, for screenshots from a hidden tab
  if (/\bdebug\b/.test(location.search)) window.__ff = secs => { const end = now + secs; while (now < end) { now += 0.05; stepAnims(); } camRadius = camRadiusGoal; camYaw = camYawGoal; camElev = camElevGoal; camTarget.copy(camGoal);
    camera.position.set(camTarget.x + Math.sin(camYaw) * camRadius, camTarget.y + camRadius * camElev, camTarget.z + Math.cos(camYaw) * camRadius); camera.lookAt(camTarget); placeLabels(); renderer.render(scene, camera); return now; };
  layout(); go(0, true); schedule(frame);
})();
</script>
