<script type="module">
/* Pill 08: reading the downhill from the numbers alone. The digit network at its random start; one knob nudged and the
change in loss divided by the nudge; the nudge shrunk until the ratio settles: the slope. Then the slope of a weight is
its input, and the field of all 2,778 slopes at the start and after training. Every number comes from digits/net.json
and digits/slope.json, produced by numpy scripts next to the training script. */
(function () {
  'use strict';
  const K = Pill.create({ grid: [260,130,25,-9.8] });
  const { say, state, mk, anim, pulse, later, draw, on, clearAnims, makePanel, scene, easeInOut } = K;

  // ---------- the trained network and the slope numbers measured around it ----------
  const NET = __NET__;
  const SL = __SLOPE__;
  const ST = SL.start, FS = SL.field_start, FN = SL.field_now, KA = SL.A;
  const W0 = ST.w0, L0 = ST.loss, NUD = ST.nudges, SLOPE = ST.slope, BOT = ST.bottom, TAN = ST.tangents;
  // neuron 10 of the first row reading the 7 (pills 05 and 06): its sum z, its weight on pixel 21, that pixel's brightness
  const J = 10, PX = 21, DARK = SL.dark_pixels[0], x7 = NET.samples[2].pixels.map(v => v / 16);
  const Z10 = NET.b1[J] + x7.reduce((s, v, i) => s + v * NET.W1[i][J], 0), WJ = NET.W1[PX][J], XJ = x7[PX], REST = Z10 - WJ * XJ;
  const f4 = v => (v >= 0 ? '' : '−') + Math.abs(v).toFixed(4), f5 = v => (v >= 0 ? '' : '−') + Math.abs(v).toFixed(5), f3 = v => (v >= 0 ? '' : '−') + Math.abs(v).toFixed(3), f2 = v => (v >= 0 ? '' : '−') + Math.abs(v).toFixed(2);
  const sg = v => (v > 0 ? '+' : '') + f4(v), tick = v => (v >= 0 ? '' : '−') + String(Math.abs(v)), n = v => v.toLocaleString('en');
  const READS = FS.count * SL.n_train;

  // ---------- scene ----------
  const C = { input: 0x4fd1ff, knob: 0xf5b942, signal: 0xc084fc, output: 0x5eead4, bad: 0xfb7185, dark: 0x11182e, dim: 0x4a557a, axis: 0x3a4670, faint: 0x1e2746 };

  // ---------- labels ----------

  // ---------- panels ----------
  const PW = 8, PH = 8, PY0 = -4, ZS = 1.5;
  const P1 = makePanel({ x0: -4.0, w: PW, y0: PY0, h: PH, xmin: -6, xmax: 6, ymin: 2.2, ymax: 2.6, xt: [-6, -3, 0, 3, 6], yt: [2.2, 2.3, 2.4, 2.5, 2.6], yf: f2, xName: 'w = the knob of pill 04, at the random start', yName: `loss over all ${n(SL.n_train)} pictures`, xHue: '#f5b942', yHue: '#5eead4' });
  const PZ = makePanel({ x0: 9.6, w: PW, y0: PY0, h: PH, xmin: W0 - ZS, xmax: W0 + ZS, ymin: 2.27, ymax: 2.34, xt: [-1, 0, 1], yt: [2.28, 2.30, 2.32, 2.34], yf: f2, xName: 'the same knob, close up', yName: 'loss', xHue: '#f5b942', yHue: '#5eead4' });
  const P3 = makePanel({ x0: 25.6, w: PW, y0: PY0, h: PH, xmin: -6, xmax: 6, ymin: -4, ymax: 4, xt: [-6, -3, 0, 3, 6], yt: [-4, -2, 0, 2, 4], xName: `w = the weight of neuron ${J} on pixel ${PX}`, yName: `z of neuron ${J}, before the squash`, xHue: '#f5b942', yHue: '#c084fc' });
  const ws = Array.from({ length: 121 }, (_, k) => -6 + 0.1 * k);
  const L = {
    curve: P1.add(ws.map((w, k) => [P1.px(w), P1.py(ST.curve[k])]), C.output), zoom: PZ.add(ST.zoom_w.map((w, k) => [PZ.px(w), PZ.py(ST.zoom[k])]), C.output),
    tanA: P1.seg(C.signal), tanB: P1.seg(C.signal), tanC: P1.seg(C.signal), tanBot: P1.seg(C.signal),
    run: PZ.seg(C.knob, 0.8), rise: PZ.seg(C.knob, 0.8), secs: NUD.map((d, k) => PZ.seg(C.knob, [0.9, 0.7, 0.55, 0.45][k])), tanZ: PZ.seg(C.signal, 1, 0.04),
    lineW: P3.seg(C.signal), lineDark: P3.seg(C.signal, 0.6), run3: P3.seg(C.knob, 0.8), rise3: P3.seg(C.knob, 0.8)
  };
  L.curve.geometry.setDrawRange(0, 0); L.zoom.geometry.setDrawRange(0, 0);
  const secLine = (seg, s, t) => seg.set(W0 - ZS, L0 - ZS * s, W0 + ZS, L0 + ZS * s, t);      // a line through the standing point with slope s, across the close-up
  const tanLine = (seg, w, l, s, t) => seg.set(w - 1.2, l - 1.2 * s, w + 1.2, l + 1.2 * s, t);  // a short tangent on the full curve
  const dots = { here1: P1.dot(C.knob, 0.2), hereZ: PZ.dot(C.knob, 0.2), nudges: NUD.map(() => PZ.dot(C.knob, 0.14)), sweep: P1.dot(C.output), bottom: P1.dot(C.output, 0.2), tA: P1.dot(C.signal, 0.13), tC: P1.dot(C.signal, 0.13), w3: P3.dot(C.knob, 0.2) };
  dots.here1.position.set(P1.px(W0), P1.py(L0), 0.05); dots.hereZ.position.set(PZ.px(W0), PZ.py(L0), 0.05);
  NUD.forEach((d, k) => dots.nudges[k].position.set(PZ.px(W0 + d.h), PZ.py(d.loss), 0.05));
  dots.bottom.position.set(P1.px(BOT.w), P1.py(BOT.loss), 0.05); dots.tA.position.set(P1.px(TAN[0].w), P1.py(TAN[0].loss), 0.05); dots.tC.position.set(P1.px(TAN[2].w), P1.py(TAN[2].loss), 0.05);
  dots.w3.position.set(P3.px(WJ), P3.py(Z10), 0.05);
  const L1 = NUD[0].loss;
  const tl = {
    here1: mk('#f5b942', P1.px(W0) + 0.3, P1.py(L0) - 0.85, 'tag mono left'), q: mk('#8e99bd', P1.px(2.5), P1.py(2.56), 'tag'),
    hereZ: mk('#f5b942', PZ.px(W0) + 0.35, PZ.py(L0) + 0.5, 'tag mono left'), nudged: mk('#f5b942', PZ.px(W0 + 1) + 0.3, PZ.py(L1) + 0.25, 'tag mono left'),
    run: mk('#f5b942', PZ.px(W0 + 0.58), PZ.py(L0) - 0.42, 'mono'), rise: mk('#f5b942', PZ.px(W0 + 1) + 0.25, PZ.py((L0 + L1) / 2), 'mono left'),
    slope1: mk('#f5b942', PZ.px(W0 - ZS) + 0.2, PZ.py(2.335), 'tag mono left'), sec1: mk('#f5b942', PZ.px(W0 + ZS) + 0.3, PZ.py(L0 + ZS * NUD[0].slope), 'tag mono left'),
    tanZ: mk('#c084fc', PZ.px(W0 + ZS) + 0.3, PZ.py(L0 + ZS * SLOPE), 'tag mono left'),
    tanA: mk('#c084fc', P1.px(TAN[0].w) + 0.5, P1.py(TAN[0].loss) + 0.55, 'tag mono left'), tanB: mk('#c084fc', P1.px(W0) - 0.5, P1.py(L0) - 0.75, 'tag mono right'),
    tanC: mk('#c084fc', P1.px(TAN[2].w) + 0.25, P1.py(TAN[2].loss) - 0.4, 'tag mono left'), bottom: mk('#5eead4', P1.px(BOT.w), P1.py(BOT.loss) - 1.3, 'tag mono'),
    lineW: mk('#4fd1ff', P3.px(4.5) - 0.3, P3.py(4.5 * XJ + REST) + 0.5, 'tag mono right'), lineDark: mk('#4fd1ff', P3.px(-5.8), P3.py(Z10) + 0.8, 'tag mono left'),
    run3: mk('#f5b942', P3.px(WJ + 0.5), P3.py(Z10) - 0.45, 'mono'), rise3: mk('#f5b942', P3.px(WJ + 1) + 0.25, P3.py(Z10 + XJ / 2), 'mono left')
  };
  say(tl.here1, `here: w = ${f2(W0)}, loss ${f4(L0)}`); say(tl.q, 'the bowl is not drawn · which way is downhill?');
  say(tl.hereZ, `here: w = ${f2(W0)}, loss ${f4(L0)}`); say(tl.nudged, `nudged by 1: loss ${f4(L1)}`); say(tl.run, '+1 in w'); say(tl.rise, `${f5(L1 - L0)} in loss`);
  say(tl.slope1, `slope = rise / run = ${f5(NUD[0].slope)}`); say(tl.sec1, `nudge 1: ${f5(NUD[0].slope)}`); say(tl.tanZ, `the slope: ${f5(SLOPE)}`);
  say(tl.tanA, `at ${tick(TAN[0].w)}: slope ${f4(TAN[0].slope)}`); say(tl.tanB, `slope ${f4(SLOPE)}`); say(tl.tanC, `at ${tick(TAN[2].w)}: ${sg(TAN[2].slope)}`); say(tl.bottom, `bottom: w = ${f2(BOT.w)}, slope ${f4(BOT.slope)}`);
  say(tl.lineW, `pixel ${PX}: x = ${f3(XJ)} → slope ${f3(XJ)}`); say(tl.lineDark, `pixel ${DARK}: x = 0<br>flat, slope 0`); say(tl.run3, '+1 in w'); say(tl.rise3, `+${f3(XJ)} in z`);

  // ---------- the field of all 2,778 slopes, as tiles: teal = loss falls when the knob grows, pink = loss rises ----------
  const FX = 42.0, FY1 = 6.8, FY2 = -0.9, T = 0.2, TS = 0.17, GMAX = FS.max_abs;
  const OX2 = 64 * T + 1.2, OX3 = OX2 + 32 * T + 1.2, FW = OX3 + 16 * T + 0.5;
  function makeField(F, oy) {
    const pos = [], col = [], idx = [], c = new THREE.Color(), base = new THREE.Color(C.dark), neg = new THREE.Color(C.output), posC = new THREE.Color(C.bad);
    function tile(x, y, g) { const k = pos.length / 3, cx = FX + x + T / 2, cy = oy - y - T / 2, h = TS / 2; c.copy(base).lerp(g < 0 ? neg : posC, Math.sqrt(Math.min(1, Math.abs(g) / GMAX)));
      pos.push(cx - h, cy - h, 0, cx + h, cy - h, 0, cx + h, cy + h, 0, cx - h, cy + h, 0); for (let i = 0; i < 4; i++) col.push(c.r, c.g, c.b); idx.push(k, k + 1, k + 2, k, k + 2, k + 3); }
    for (let i = 0; i < 64; i++) for (let j = 0; j < 32; j++) tile(i * T, j * T, F.W1[i][j]);
    for (let j = 0; j < 32; j++) tile(64 * T + 0.3, j * T, F.b1[j]);
    for (let j = 0; j < 32; j++) for (let k = 0; k < 16; k++) tile(OX2 + j * T, k * T, F.W2[j][k]);
    for (let k = 0; k < 16; k++) tile(OX2 + 32 * T + 0.3, k * T, F.b2[k]);
    for (let k = 0; k < 16; k++) for (let m = 0; m < 10; m++) tile(OX3 + k * T, m * T, F.W3[k][m]);
    for (let m = 0; m < 10; m++) tile(OX3 + 16 * T + 0.3, m * T, F.b3[m]);
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); geo.setIndex(idx);
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0, side: THREE.DoubleSide })); mesh.visible = false; scene.add(mesh);
    return { mesh, show(a) { mesh.material.opacity = a; mesh.visible = a > 0.01; } };
  }
  const fieldStart = makeField(FS, FY1), fieldNow = makeField(FN, FY2);
  const BIG = FS.biggest.at, ring = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.28, 32), new THREE.MeshBasicMaterial({ color: C.knob, side: THREE.DoubleSide }));
  ring.position.set(FX + OX3 + BIG[0] * T + T / 2, FY1 - BIG[1] * T - T / 2, 0.05); ring.visible = false; scene.add(ring);
  const fl = {
    h1: mk('#8e99bd', FX + 32 * T, FY1 + 0.5, 'head'), h2: mk('#8e99bd', FX + OX2 + 16 * T, FY1 + 0.5, 'head'), h3: mk('#8e99bd', FX + OX3 + 8 * T, FY1 + 0.5, 'head'),
    start: mk('#eef1fb', FX - 0.8, FY1 - 3.2, 'big right'), now: mk('#eef1fb', FX - 0.8, FY2 - 3.2, 'big right'),
    big: mk('#f5b942', FX + FW, FY1 + 1.5, 'tag mono right'), legend: mk('#8e99bd', FX + FW / 2, FY2 - 32 * T - 0.9, 'tag')
  };
  say(fl.h1, '64 → 32'); say(fl.h2, '32 → 16'); say(fl.h3, '16 → 10');
  say(fl.start, `at the start<br><i>loss ${f4(L0)} · ${n(FS.count)} slopes</i>`); say(fl.now, `trained<br><i>loss ${f4(SL.now.loss)} · the same knobs</i>`);
  say(fl.big, `steepest (ringed): hidden ${BIG[0]} → score ${BIG[1]}, slope ${f4(FS.biggest.slope)}`);
  say(fl.legend, 'teal: the loss falls when the knob grows, turn it up · pink: turn it down · brighter: steeper · thin columns: the biases');

  // ---------- tiny tween engine ----------
  function sweep(P, dot, line, M, xs, ys, dur, delay) { dot.visible = false; later(() => { dot.visible = true; }, delay);
    anim(t => { const k = Math.round(t * M); dot.position.set(P.px(xs(k)), P.py(ys(k)), 0.05); draw(line, k); }, dur, delay, easeInOut); }
  const show = (dot, lab, at) => later(() => { dot.visible = true; pulse(dot, 0.8, 0); if (lab) state(lab, 'on'); }, at);
  const grow = (seg, args, dur, at, lab) => { anim(t => seg.set(...args, t), dur, at); if (lab) later(() => state(lab, 'on'), at + dur * 0.6); };

  // ---------- the steps ----------
  const S1 = [P1.px(-6) - 2.4, P1.px(6) + 1.6, -6.0, 5.9], S2 = [PZ.px(W0 - ZS) - 2.4, PZ.px(W0 + ZS) + 5.8, -6.0, 5.9], S4 = [P1.px(-6) - 2.4, PZ.px(W0 + ZS) + 1.6, -6.0, 5.9],
    S5 = [P3.px(-6) - 2.4, P3.px(6) + 1.6, -6.0, 5.9], S6 = [FX - 4.4, FX + FW + 3.6, FY2 - 32 * T - 1.6, FY1 + 2.1];
  const steps = [
    { dur: 17, title: 'Where the knobs start', box: S1, yaw: -0.04,
      text: `Training begins with random knobs. Rewind the digit network to that start: its loss over the ${n(SL.n_train)} pictures is ${f4(L0)}, and the knob of pill 04 happens to sit at ${f2(W0)}. Pill 07 drew bowls, but drawing one costs 121 full passes over every picture, and there are ${n(FS.count)} knobs. Training cannot afford to look. All it has is where it stands: one knob value, one loss. The question of this pill: from that alone, which way is downhill, and how steep?`,
      line: `the start: w = ${f2(W0)} · loss ${f4(L0)} · the bowl: unknown` },
    { dur: 18, title: 'Nudge it and measure', box: S2, yaw: 0,
      text: `Turn the knob up by 1 and measure again: the loss is ${f4(L1)}, down by ${f5(L0 - L1)}. Divide the change in loss by the change in the knob: ${f5(NUD[0].slope)} per unit of knob. That is a slope, the same rise over run as m in pill 05. Its sign gives the direction: negative means the loss falls as the knob grows, so downhill is to the right. Its size says how steep the ground is: here, gentle. Two measurements, one division, and the dark has a direction in it.`,
      line: `nudge +1: loss ${f4(L0)} → ${f4(L1)} · slope = ${f5(L1 - L0)} / 1 = ${f5(NUD[0].slope)}` },
    { dur: 19, title: 'Shrink the nudge', box: S2, yaw: 0,
      text: `A nudge of 1 measures the average over a whole stretch, and the curve may bend inside it. Shrink the nudge: 0.1 gives ${f5(NUD[1].slope)}, 0.01 gives ${f5(NUD[2].slope)}, 0.001 gives ${f5(NUD[3].slope)}. The ratios settle on one number, ${f5(SLOPE)}: the slope at this exact point, the ground under the feet rather than the ground a step away. In maths this number is the derivative of the loss with respect to the knob, and training uses nothing else. The recipe is plain: nudge, measure, divide, and shrink the nudge until the answer stops moving.`,
      line: `nudge 0.1 → ${f5(NUD[1].slope)} · 0.01 → ${f5(NUD[2].slope)} · 0.001 → ${f5(NUD[3].slope)} · the slope: ${f5(SLOPE)}` },
    { dur: 18, title: 'The curve nobody drew', box: S4, yaw: 0.04,
      text: `Now draw the whole curve as a check, the one training never sees. At the knob’s point a straight line with slope ${f4(SLOPE)} hugs the curve: right there the two are indistinguishable. Elsewhere the slope is different: steep down at −4, ${f4(TAN[0].slope)}, steep up at 5, ${sg(TAN[2].slope)}. At the bottom, w = ${f2(BOT.w)}, the slope is ${f4(BOT.slope)}: flat ground. That is how a bottom is recognised without seeing the bowl: every slope is zero. And a slope is local. It describes the ground at one point and promises nothing about how far the bottom is, which is why pill 07 ended on small turns.`,
      line: `slope at −4: ${f4(TAN[0].slope)} · at ${f2(W0)}: ${f4(SLOPE)} · bottom ${f2(BOT.w)}: ${f4(BOT.slope)} · at 5: ${sg(TAN[2].slope)}` },
    { dur: 19, title: 'The slope of a weight is its input', box: S5, yaw: 0.06,
      text: `Pills 05 and 06 promised one slope for free. Take neuron ${J} of the first row reading the 7, and its weight on pixel ${PX}, ${f3(WJ)}. Turn that weight by 1 and the neuron’s sum z moves by ${f3(XJ)}, the brightness of that pixel. Turn it by 0.1 and z moves by ${f4(XJ / 10)}. The ratio is ${f3(XJ)} every time, at every point, because z against one weight is a straight line, and a line has one slope: the input on that wire. No nudging needed. A dark pixel gives a flat line: its weight can move all it likes and z does not change, slope 0. Pixels ${SL.dark_pixels[0]} and ${SL.dark_pixels[1]} are dark in all ${n(SL.n_train)} pictures, so the ${FS.n_zero} knobs reading them have slope exactly 0 for the whole set. They can never learn anything.`,
      line: `z of neuron ${J} against its weight on pixel ${PX}: slope = x = ${f3(XJ)} · pixel ${DARK}: x = 0, slope 0` },
    { dur: 23, title: 'One slope per knob', box: S6, yaw: 0,
      text: `Every knob has a slope at the point where the network stands: ${n(FS.count)} of them. At the random start, teal where the loss falls when the knob grows, pink where it rises, brighter where steeper. The steepest is a wire into the score for ${BIG[1]}, ${f4(FS.biggest.slope)}; ${n(FS.n_neg)} knobs want up, ${n(FS.n_pos)} want down, ${FS.n_zero} are exactly flat, the dark pixels. After training the same field is about five times fainter, ${f5(FN.mean_abs)} on average against ${f5(FS.mean_abs)}, but not zero: training stopped after 60 passes, near a bottom, not on it. That is the little leftover downhill of pill 07. One problem remains. Measuring by nudging costs one pass over ${n(SL.n_train)} pictures per knob, ${(READS / 1e6).toFixed(1)} million picture readings for a single small turn, and training takes thousands of turns. The next pill gets all ${n(FS.count)} slopes from one pass.`,
      line: `start: ${n(FS.count)} slopes, steepest ${f4(FS.biggest.slope)}, mean size ${f5(FS.mean_abs)} · trained: mean ${f5(FN.mean_abs)} · by nudging: ${n(FS.count)} passes per turn` }
  ];

  // deterministic resting state at the start of step i
  function baseState(i) {
    clearAnims();
    P1.show(1); PZ.show(i >= 1 ? 1 : 0); P3.show(i >= 4 ? 1 : 0);
    for (const [P, hot] of [[P1, i === 0 || i === 3], [PZ, i === 1 || i === 2], [P3, i === 4]]) if (P.g.visible) { state(P.xName, hot ? 'on' : 'dim'); state(P.yName, hot ? 'on' : 'dim'); }
    const dimOn = (lab, on, hot) => state(lab, on ? (hot ? 'on' : 'dim') : '');
    const col = (line, on, hot, color) => { line.visible = on; line.material.color.setHex(hot ? color : C.dim); };
    dots.here1.visible = true; dots.hereZ.visible = i >= 1; dots.sweep.visible = false; dots.bottom.visible = i >= 4; dots.tA.visible = i >= 4; dots.tC.visible = i >= 4; dots.w3.visible = i >= 5;
    NUD.forEach((d, k) => { dots.nudges[k].visible = k === 0 ? i >= 2 : i >= 3; });
    dimOn(tl.here1, true, i === 0); dimOn(tl.q, true, i === 0);
    dimOn(tl.hereZ, i >= 1, i === 1); dimOn(tl.nudged, i >= 2, i === 1); dimOn(tl.run, i >= 2, i === 1); dimOn(tl.rise, i >= 2, i === 1); dimOn(tl.slope1, i >= 2, i === 1); dimOn(tl.sec1, i >= 3, i === 2);
    dimOn(tl.tanZ, i >= 3, i === 2); dimOn(tl.tanA, i >= 4, i === 3); dimOn(tl.tanB, i >= 4, i === 3); dimOn(tl.tanC, i >= 4, i === 3); dimOn(tl.bottom, i >= 4, i === 3);
    dimOn(tl.lineW, i >= 5, i === 4); dimOn(tl.lineDark, i >= 5, i === 4); dimOn(tl.run3, i >= 5, i === 4); dimOn(tl.rise3, i >= 5, i === 4);
    L.run.set(W0, L0, W0 + 1, L0); L.rise.set(W0 + 1, L0, W0 + 1, L1); col(L.run, i >= 2, i === 1, C.knob); col(L.rise, i >= 2, i === 1, C.knob);
    NUD.forEach((d, k) => { secLine(L.secs[k], d.slope); col(L.secs[k], k === 0 ? i >= 2 : i >= 3, k === 0 ? i === 1 || i === 2 : i === 2, C.knob); });
    secLine(L.tanZ, SLOPE); col(L.tanZ, i >= 3, i === 2, C.signal);
    L.curve.geometry.setDrawRange(0, i >= 4 ? 121 : 0); L.zoom.geometry.setDrawRange(0, i >= 4 ? 61 : 0); L.curve.material.color.setHex(i === 3 ? C.output : C.dim); L.zoom.material.color.setHex(i === 3 ? C.output : C.dim);
    tanLine(L.tanA, TAN[0].w, TAN[0].loss, TAN[0].slope); tanLine(L.tanB, W0, L0, SLOPE); tanLine(L.tanC, TAN[2].w, TAN[2].loss, TAN[2].slope); tanLine(L.tanBot, BOT.w, BOT.loss, BOT.slope);
    for (const s of [L.tanA, L.tanB, L.tanC, L.tanBot]) col(s, i >= 4, i === 3, C.signal);
    L.lineW.set(-6, -6 * XJ + REST, 6, 6 * XJ + REST); L.lineDark.set(-6, Z10, 6, Z10); L.run3.set(WJ, Z10, WJ + 1, Z10); L.rise3.set(WJ + 1, Z10, WJ + 1, Z10 + XJ);
    col(L.lineW, i >= 5, i === 4, C.signal); col(L.lineDark, i >= 5, i === 4, C.signal); col(L.run3, i >= 5, i === 4, C.knob); col(L.rise3, i >= 5, i === 4, C.knob);
    fieldStart.show(i >= 5 ? 1 : 0); fieldNow.show(i >= 5 ? 1 : 0); ring.visible = i >= 5; for (const k of Object.keys(fl)) state(fl[k], i >= 5 ? 'on' : '');
  }

  const enter = [
    () => { P1.show(0); anim(a => P1.show(a), 0.9, 0.4); dots.here1.visible = false; state(tl.here1, ''); state(tl.q, '');
      show(dots.here1, tl.here1, 1.8); later(() => state(tl.q, 'on'), 4.5); },
    () => { PZ.show(0); anim(a => PZ.show(a), 0.9, 0.4); dots.hereZ.visible = false; dots.nudges[0].visible = false; state(tl.hereZ, ''); state(tl.nudged, ''); state(tl.run, ''); state(tl.rise, ''); state(tl.slope1, '');
      L.run.visible = false; L.rise.visible = false; L.secs[0].visible = false;
      show(dots.hereZ, tl.hereZ, 1.4); show(dots.nudges[0], tl.nudged, 3.2);
      grow(L.run, [W0, L0, W0 + 1, L0], 0.9, 4.6, tl.run); grow(L.rise, [W0 + 1, L0, W0 + 1, L1], 0.9, 5.8, tl.rise);
      anim(t => secLine(L.secs[0], NUD[0].slope, t), 1.4, 7.4); later(() => state(tl.slope1, 'on'), 8.4); },
    () => { for (let k = 1; k < 4; k++) { L.secs[k].visible = false; dots.nudges[k].visible = false; } L.tanZ.visible = false; state(tl.sec1, ''); state(tl.tanZ, '');
      later(() => state(tl.sec1, 'on'), 0.8);
      for (let k = 1; k < 4; k++) { const at = 1.2 + 2.2 * (k - 1); show(dots.nudges[k], null, at); anim(t => secLine(L.secs[k], NUD[k].slope, t), 1.2, at + 0.4); }
      anim(t => secLine(L.tanZ, SLOPE, t), 1.4, 8.4); later(() => state(tl.tanZ, 'on'), 9.4); },
    () => { L.curve.geometry.setDrawRange(0, 0); L.zoom.geometry.setDrawRange(0, 0); for (const s of [L.tanA, L.tanB, L.tanC, L.tanBot]) s.visible = false;
      dots.bottom.visible = false; dots.tA.visible = false; dots.tC.visible = false; for (const k of ['tanA', 'tanB', 'tanC', 'bottom']) state(tl[k], '');
      sweep(P1, dots.sweep, L.curve, 120, k => ws[k], k => ST.curve[k], 5.5, 1.0); anim(t => draw(L.zoom, Math.round(t * 60)), 5.5, 1.0, easeInOut); later(() => { dots.sweep.visible = false; }, 6.6);
      later(() => { L.tanB.visible = true; pulse(dots.here1, 0.8, 0); state(tl.tanB, 'on'); }, 7.0);
      show(dots.tA, tl.tanA, 8.6); later(() => { L.tanA.visible = true; }, 8.6); show(dots.tC, tl.tanC, 10.0); later(() => { L.tanC.visible = true; }, 10.0);
      show(dots.bottom, tl.bottom, 11.6); later(() => { L.tanBot.visible = true; }, 11.6); },
    () => { P3.show(0); anim(a => P3.show(a), 0.9, 0.4); L.lineW.visible = false; L.lineDark.visible = false; L.run3.visible = false; L.rise3.visible = false; dots.w3.visible = false; for (const k of ['lineW', 'lineDark', 'run3', 'rise3']) state(tl[k], '');
      grow(L.lineW, [-6, -6 * XJ + REST, 6, 6 * XJ + REST], 2.0, 1.4, tl.lineW); show(dots.w3, null, 3.8);
      grow(L.run3, [WJ, Z10, WJ + 1, Z10], 0.9, 4.6, tl.run3); grow(L.rise3, [WJ + 1, Z10, WJ + 1, Z10 + XJ], 0.9, 5.8, tl.rise3);
      grow(L.lineDark, [-6, Z10, 6, Z10], 1.8, 9.0, tl.lineDark); },
    () => { fieldStart.show(0); fieldNow.show(0); ring.visible = false; for (const k of Object.keys(fl)) state(fl[k], '');
      anim(a => fieldStart.show(a), 1.6, 0.6); later(() => { for (const k of ['h1', 'h2', 'h3', 'start']) state(fl[k], 'on'); }, 1.2);
      later(() => { ring.visible = true; pulse(ring, 0.9, 0); state(fl.big, 'on'); }, 3.6);
      anim(a => fieldNow.show(a), 1.6, 7.0); later(() => state(fl.now, 'on'), 7.6); later(() => state(fl.legend, 'on'), 10.0); }
  ];

  // ---------- ledger ----------
  const ledgerEl = document.getElementById('ledger');
  function renderLedger(i) {
    ledgerEl.innerHTML = '<div class="ln title">the slope so far</div>';
    for (let k = 0; k <= i; k++) { if (!steps[k].line) continue; const d = document.createElement('div'); d.className = 'ln' + (k === i ? ' now' : ''); d.innerHTML = steps[k].line; ledgerEl.appendChild(d); }
  }

  // ---------- camera ----------

  K.run({ steps, enter, baseState, ledger: renderLedger });
})();
</script>
</body>
</html>
