<body>
<div id="stage"></div>

<div id="eyebrow"><span>Knowledge pill <b>12</b> · the names</span><span id="count">1 / 7</span></div>
<div id="deck">
  <div id="card">
    <h1 id="title"></h1>
    <p id="text"></p>
    <div id="ledger"></div>
  </div>
  <div id="controls">
    <button id="prev" type="button" aria-label="Previous step">◀ Back</button>
    <button id="play" type="button" aria-label="Play or pause">Pause</button>
    <button id="next" type="button" aria-label="Next step">Next ▶</button>
    <div id="dots" aria-hidden="true"></div>
  </div>
</div>

<script src="../vendor/three/three.min.js"></script>
<script src="../kit/pill.js"></script>
<script>
/* Pill 12: the standard names for everything seen in pills 02 to 11, placed on the digit network itself while it
reads the 7 of pill 03. Every number comes from digits/names.json (the trained network of net.json, one forward
pass, one backward pass, the gradient over the training set) and the bowl of pill 07 from digits/loss.json. */
/* below the eyebrow: nothing in the scene can sit under it */
(function () {
  'use strict';
  const K = Pill.create({ fog: [90,190], far: 400, radius: 40, grid: [260,130,0,-20.5] });
  const { label, say, state, glowMat, lineMat, anim, later, on, fadeIn, drawTo, clearAnims, makePanel, scene, easeInOut } = K;

  // ---------- the trained network reading the 7 ----------
  const D = __NAMES__;
  const BOWL = __CURVE__;  // pill 07's bowl: loss over knob A turned −6…6, all training pictures
  const f4 = v => (v >= 0 ? '' : '−') + Math.abs(v).toFixed(4), n = v => v.toLocaleString('en');
  const pct1 = v => (v * 100).toFixed(1) + '%', pct2 = v => (v * 100).toFixed(2) + '%';
  const pRight = pct2(D.p_right), loss7 = (-Math.log(Math.round(D.p_right * 1e4) / 1e4)).toFixed(2);  // −log(0.24%), as pill 07 showed it

  // ---------- scene ----------
  const C = { input: 0x4fd1ff, knob: 0xf5b942, signal: 0xc084fc, output: 0x5eead4, bad: 0xfb7185, node: 0x3a4a86, dark: 0x11182e, dim: 0x4a557a, axis: 0x3a4670, faint: 0x1e2746, muted: 0x8e99bd };
  const COL = Object.fromEntries(Object.entries(C).map(([k, v]) => [k, new THREE.Color(v)]));
  const V = (x, y, z) => new THREE.Vector3(x, y, z || 0);

  // ---------- labels ----------
  const anchor = (x, y, z) => { const a = new THREE.Object3D(); a.position.set(x, y, z || 0); scene.add(a); return a; };
  const mk = (hue, x, y, cls, ref) => label(hue, anchor(x, y, 0.1), cls, ref || 30);
  // a name tag: the standard word, then our word for it in grey
  const name = (hue, x, y, term, gloss, cls, ref) => { const L = mk(hue, x, y, 'tag ' + (cls || ''), ref); say(L, term + (gloss ? ` <i>· ${gloss}</i>` : '')); return L; };

  // ---------- geometry helpers ----------
  function quads(x0, ytop, rows, cols, pitch, size, colorAt) {
    const pos = new Float32Array(rows * cols * 4 * 3), col = new Float32Array(rows * cols * 4 * 3), idx = []; let k = 0;
    const c = new THREE.Color();
    for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
      const cx = x0 + (q + 0.5) * pitch, cy = ytop - (r + 0.5) * pitch, hs = size / 2; colorAt(r, q, c);
      const v = k * 4; const corners = [[cx - hs, cy - hs], [cx + hs, cy - hs], [cx + hs, cy + hs], [cx - hs, cy + hs]];
      corners.forEach((p, j) => { pos.set([p[0], p[1], 0], (v + j) * 3); col.set([c.r, c.g, c.b], (v + j) * 3); });
      idx.push(v, v + 1, v + 2, v, v + 2, v + 3); k++;
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setIndex(idx);
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 1, side: THREE.DoubleSide })); scene.add(m); return m;
  }
  const shade = (c, base, a) => c.copy(COL.dark).lerp(base, 0.08 + 0.92 * Math.min(1, a));
  function tube(a, b, r, color) {
    const len = a.distanceTo(b), g = new THREE.CylinderGeometry(r, r, 1, 12, 1); g.translate(0, 0.5, 0);
    const m = new THREE.Mesh(g, glowMat(color)); m.material.emissiveIntensity = 0.5; m.position.copy(a);
    m.quaternion.setFromUnitVectors(V(0, 1, 0), b.clone().sub(a).normalize()); m.scale.set(1, len, 1);
    m.set = t => { m.scale.y = Math.max(0.001, len * t); m.visible = t > 0.001; }; scene.add(m); return m;
  }
  function cone(tip, dir, color, size) {
    const g = new THREE.ConeGeometry(size * 0.45, size, 16); g.translate(0, -size / 2, 0);
    const m = new THREE.Mesh(g, glowMat(color)); m.material.emissiveIntensity = 0.5; m.position.copy(tip); m.quaternion.setFromUnitVectors(V(0, 1, 0), dir.clone().normalize()); scene.add(m); return m;
  }
  const arrow = (a, b, color) => { const t = tube(a, b, 0.07, color), c = cone(b, b.clone().sub(a), color, 0.7); return { t, c, set(k) { t.set(k); c.visible = k > 0.95; }, color(h) { t.material.color.setHex(h); t.material.emissive.setHex(h); c.material.color.setHex(h); c.material.emissive.setHex(h); } }; };

  // ---------- the picture and the network ----------
  const pic = quads(-32.5, 2, 8, 8, 0.5, 0.46, (r, q, c) => shade(c, COL.input, D.pixels[r * 8 + q] / 16));
  const picArrow = arrow(V(-28.1, 0), V(-23.0, 0), C.muted);
  const COLS = [{ x: -22, n: 64, pitch: 0.22, r: 0.09 }, { x: -13, n: 32, pitch: 0.42, r: 0.18 }, { x: -4, n: 16, pitch: 0.8, r: 0.26 }, { x: 5, n: 10, pitch: 1.2, r: 0.36 }];
  const posY = (c, i) => (c.n - 1) / 2 * c.pitch - i * c.pitch;
  const nodes = COLS.map((c, l) => Array.from({ length: c.n }, (_, i) => {
    const hot = l === 0 ? COL.dark.clone().lerp(COL.input, 0.12 + 0.88 * D.pixels[i] / 16) : new THREE.Color(l === 3 ? C.output : C.node);
    const m = new THREE.Mesh(new THREE.SphereGeometry(c.r, 24, 16), glowMat(hot)); m.position.set(c.x, posY(c, i), 0); m.userData.hot = hot; scene.add(m); return m; }));
  const wirePts = [];
  for (let l = 0; l < 3; l++) for (let i = 0; i < COLS[l].n; i++) for (let j = 0; j < COLS[l + 1].n; j++) wirePts.push(COLS[l].x, posY(COLS[l], i), -0.05, COLS[l + 1].x, posY(COLS[l + 1], j), -0.05);
  const wires = new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(wirePts, 3)), lineMat(C.axis, 0.16)); scene.add(wires);
  const knobWire = tube(V(COLS[2].x, posY(COLS[2], D.A[0])), V(COLS[3].x, posY(COLS[3], D.A[1])), 0.06, C.knob);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.035, 10, 40), glowMat(C.knob)); ring.material.emissiveIntensity = 0.6; ring.position.set(COLS[1].x, posY(COLS[1], D.neuron), 0.05); scene.add(ring);
  const n10 = nodes[1][D.neuron];

  // the ten scores as bars, right of the output column
  const BX = 7, BW = 4;
  const bars = D.probs.map((p, d) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.5), glowMat(d === D.pred ? C.bad : d === D.label ? C.output : C.dim)); m.material.emissiveIntensity = 0.3; m.userData.len = Math.max(0.06, BW * p); m.userData.hot = m.material.color.getHex(); m.position.set(BX + m.userData.len / 2, posY(COLS[3], d), 0); m.scale.x = m.userData.len; scene.add(m); return m; });
  const digitLabs = D.probs.map((_, d) => { const L = mk(d === D.pred ? '#fb7185' : d === D.label ? '#5eead4' : '#8e99bd', 6.1, posY(COLS[3], d), 'mono'); say(L, String(d)); return L; });
  const pctTop = mk('#fb7185', BX + BW * D.p_top + 0.35, posY(COLS[3], D.pred), 'mono left'), pctRight = mk('#5eead4', BX + bars[D.label].userData.len + 0.35, posY(COLS[3], D.label), 'mono left');
  say(pctTop, pct2(D.p_top)); say(pctRight, pRight);
  const fwd = arrow(V(-24, 9.0), V(11.5, 9.0), C.output), bwd = arrow(V(8, -9.6), V(-24, -9.6), C.bad);

  // ---------- the bowl of pill 07 ----------
  const PL = makePanel({ drawn: true, x0: 13.5, w: 9, y0: -3.5, h: 6, xmin: -6, xmax: 6, ymin: 0, ymax: 0.3, xt: [-6, 0, 6], yt: [0, 0.1, 0.2, 0.3], xName: `knob A turned −6…6, loss on the ${n(D.n_train)} training pictures (pill 07)`, xHue: '#fb7185' });
  const bowl = PL.add(BOWL.map((v, i) => [-6 + 12 * i / (BOWL.length - 1), v]), C.bad), bowlDot = PL.dot(C.knob, 0.17); bowlDot.position.set(PL.px(D.knobA_w), PL.py(D.train_loss), 0.05);

  // ---------- the gradient over the training set, as pill 08's field ----------
  const T = 0.2, FTOP = -11.5, FX1 = -33, FX2 = -19, FX3 = -11.5, GMAX = D.max_abs_slope;
  const slopeCol = (c, g) => shade(c, g < 0 ? COL.output : COL.bad, Math.sqrt(Math.abs(g) / GMAX));
  const block = (x0, W, b, nIn, nOut) => quads(x0, FTOP, nOut, nIn + 1, T, 0.17, (r, q, c) => slopeCol(c, q < nIn ? W[q][r] : b[r]));
  const field = [block(FX1, D.field.W1, D.field.b1, 64, 32), block(FX2, D.field.W2, D.field.b2, 32, 16), block(FX3, D.field.W3, D.field.b3, 16, 10)];

  // ---------- the names ----------
  const N1 = {
    inL: name('#4fd1ff', COLS[0].x, 7.7, 'input layer', '64 pixels'), hidL: name('#c084fc', -8.5, 7.7, 'hidden layers', '32 and 16 neurons'), outL: name('#5eead4', 4, 7.7, 'output layer', '10'),
    neuron: name('#c084fc', -6, -7.0, 'neuron', `multiply, add, squash · ${D.n_neurons}`), weight: name('#f5b942', 0.5, -0.9, 'weight', 'the knob on a wire', '', 34), bias: name('#f5b942', -17.5, posY(COLS[1], D.neuron), 'bias', 'the lift', '', 34),
    params: name('#f5b942', -18, -7.5, 'parameters', `the ${n(D.n_knobs)} knobs`), model: name('#eef1fb', -3.5, -8.6, 'model', 'the shape plus its numbers: an MLP, multilayer perceptron'),
    pic: mk('#8e99bd', -30.5, -2.9, 'head') };
  say(N1.pic, 'the 7 of pill 03');
  const N2 = {
    fwd: name('#5eead4', -8.5, 9.0, 'forward pass', 'left to right, once'), pre: name('#c084fc', -8.5, 3.6, 'pre-activation', `z = ${D.z10}`, '', 34), actf: name('#c084fc', -8.5, 2.3, 'activation function', 'tanh', '', 34), act: name('#c084fc', -8.5, 1.0, 'activation', `h = ${D.h10}`, '', 34),
    logits: name('#5eead4', 2.5, -6.6, 'logits', 'raw scores'), softmax: name('#5eead4', 9, -6.6, 'softmax', 'scores → 100%'), pred: name('#fb7185', 9.5, 6.6, 'prediction', `the top score: ${D.pred}, wrong`) };
  const N3 = {
    lab: name('#5eead4', 10.5, 7.7, 'label', `the right answer: ${D.label}`), lossName: name('#fb7185', 18, 4.7, 'loss function', 'one number for how wrong'), ce: name('#fb7185', 18, 3.6, 'cross-entropy', `−log(${pRight}) = ${loss7} for the 7`),
    now: mk('#f5b942', 19.5, -1.9, 'tag mono left'), train: name('#8e99bd', 12.6, -6.3, 'training set', `${n(D.n_train)} pictures the knobs learned from`, 'left'), test: name('#4fd1ff', 12.6, -7.4, 'test set', `${n(D.n_test)} never seen · accuracy ${pct1(D.test_acc)}`, 'left'),
    gen: name('#4fd1ff', 12.6, -8.5, 'generalisation', 'right on pictures never seen', 'left') };
  say(N3.now, `mean over ${n(D.n_train)}: ${f4(D.train_loss)}`);
  const N4 = {
    h1: mk('#8e99bd', FX1 + 6.5, -10.9, 'head'), h2: mk('#8e99bd', FX2 + 3.3, -10.9, 'head'), h3: mk('#8e99bd', FX3 + 1.7, -10.9, 'head'),
    grad: name('#5eead4', -13, -15.5, 'gradient', `all ${n(D.n_knobs)} slopes together, one list`), deriv: name('#5eead4', -13, -16.6, 'derivative', 'the slope of one knob'), partial: name('#5eead4', -13, -17.7, '∂loss/∂w', 'the written form of one slope', 'mono'),
    legend: mk('#8e99bd', -26.5, -18.5, 'tag') };
  say(N4.h1, '64 → 32, + bias'); say(N4.h2, '32 → 16'); say(N4.h3, '16 → 10'); say(N4.legend, 'teal: turn up · pink: turn down · brightness: size');
  const N5 = {
    backprop: name('#fb7185', -16, -9.6, 'backpropagation', 'the backward pass'), autograd: name('#fb7185', 2, -9.6, 'autograd', 'code that does it for any forward pass · Part 2'),
    chain: name('#fb7185', -8.5, -1.2, 'chain rule', 'slopes multiply', '', 34), grad: name('#fb7185', -17.5, 1.1, '.grad', `the blame: ${D.blame_z10.toFixed(4)}`, 'mono', 34) };
  const N6 = {
    rule: mk('#f5b942', 8.5, -11.4, 'tag mono big'), gd: name('#f5b942', 8.5, -12.8, 'gradient descent', 'every knob a little against its slope'), sgd: name('#f5b942', 8.5, -13.9, 'stochastic gradient descent, SGD', `on a mini-batch: ${D.batch} pictures per step`),
    lr: name('#f5b942', 8.5, -15.0, 'learning rate', `the step size, ${D.lr}`), epoch: name('#8e99bd', 8.5, -16.1, 'epoch', `one pass over all ${n(D.n_train)} · ${D.epochs} of them`), iter: name('#8e99bd', 8.5, -17.2, 'iteration', `one step · ${D.steps_per_pass} per epoch · ${n(D.n_steps)} in all`),
    hyper: name('#8e99bd', 8.5, -18.3, 'hyperparameters', 'the numbers set by hand: step size, batch, epochs') };
  say(N6.rule, `new = old − ${D.lr} × slope`);
  const N7 = { all: mk('#5eead4', -3.25, 11.2, 'tag big', 20) };
  say(N7.all, 'the same words in every paper and library');
  const G = [Object.values(N1), Object.values(N2), Object.values(N3), Object.values(N4), Object.values(N5), Object.values(N6), Object.values(N7)];

  // ---------- tiny tween engine ----------
  function pulse(mesh, dur, delay) { const sx = mesh.scale.x, sy = mesh.scale.y, sz = mesh.scale.z; anim(t => { const k = 1 + 0.35 * Math.sin(Math.PI * t); mesh.scale.set(sx * k, sy * (mesh.set ? 1 : k), sz * k); }, dur, delay); }
  const pop = (mesh, dur, at) => { mesh.visible = false; const s = mesh.scale.x; anim(t => { mesh.visible = true; mesh.scale.setScalar(Math.max(0.001, s * t)); }, dur, at); };
  const grow = (arr, dur, at) => { arr.set(0); anim(t => arr.set(t), dur, at, easeInOut); };

  // ---------- the steps ----------
  const S1 = [-34, 12.5, -9.4, 9.8], S3 = [1.5, 27.5, -9.4, 9.8], S4 = [-34, -6, -19.2, -9.6], S5 = [-24.5, 12.5, -10.3, 9.8], S6 = [-7.5, 25, -19.2, -8.0], S7 = [-34, 27.5, -19.5, 12.8];
  const steps = [
    { dur: 18, title: 'The parts', box: S1, yaw: 0,
      text: `Every piece of the digit reader has a standard name, the same in every paper and library. A neuron, also called a unit, is the adder with a squash of pill 02; there are ${D.n_neurons} here. Neurons stand in layers: an input layer of 64 pixels, two hidden layers of 32 and 16, an output layer of 10. The knob on a wire is a weight; the lift inside a neuron is its bias. Together they are the parameters, ${n(D.n_knobs)} of them: ${n(D.n_weights)} weights and ${D.n_biases} biases. The shape plus its numbers is the model, and this shape, rows of neurons each fed by the whole row before, is a multilayer perceptron, MLP, the class Part 2 builds.`,
      line: `neuron · layer · weight · bias · parameters · model, MLP` },
    { dur: 20, title: 'Forward', box: S1, yaw: 0.05,
      text: `Running a picture through the model is the forward pass; doing it with a trained model to get an answer is inference, and the answer is its prediction. Inside neuron ${D.neuron} of the first row, the sum before the squash, ${D.z10}, is the pre-activation. The squash is the activation function, tanh here, ReLU in most networks today, and what leaves, ${D.h10}, is the activation. The ten raw scores at the end are the logits; softmax turns them into scores that add up to 100%, so each can be read as the model’s confidence. For this 7 the top score goes to ${D.pred}, at ${pct2(D.p_top)}: the prediction is wrong.`,
      line: `forward pass · pre-activation · activation function · activation · logits · softmax · prediction` },
    { dur: 18, title: 'The loss', box: S3, yaw: 0.1,
      text: `The right answer attached to a picture is its label: ${D.label}. The loss function turns a prediction and a label into one number for how wrong: this one is cross-entropy, minus the log of the score given to the right digit, −log(${pRight}) = ${loss7} for this picture. Averaged over the ${n(D.n_train)} pictures of the training set, the ones the knobs learned from, it is ${f4(D.train_loss)}, pill 07’s bowl. The ${n(D.n_test)} pictures of the test set were never used for learning; the share it gets right there, ${pct1(D.test_acc)}, is its accuracy, and doing well on pictures never seen is generalisation, the point of the whole exercise.`,
      line: `label · loss function, cross-entropy · training set · test set · accuracy · generalisation` },
    { dur: 16, title: 'The slopes', box: S4, yaw: -0.05,
      text: `How the loss moves when one knob turns is that knob’s derivative, pill 08’s slope. It is written ∂loss/∂w, the curly d saying that every other knob is held still. All ${n(D.n_knobs)} slopes together, one list, is the gradient. It points the way the loss rises fastest; the recipe walks the other way. At the trained knobs the gradient over the training pictures is small, mean ${f4(D.mean_abs_slope)}, knob A’s own slope ${f4(D.knobA_slope)}: the field is dim because little is left to fix on the training pictures.`,
      line: `derivative · ∂loss/∂w · gradient` },
    { dur: 18, title: 'Backward', box: S5, yaw: 0.02,
      text: `Computing the whole gradient in one walk from the loss back to the inputs is the backward pass, or backpropagation; the maths it leans on is the chain rule of pill 09, slopes multiplying along a path and adding across paths. What pill 09 called blame, the slope of the loss against a neuron’s sum, is what code stores in a field named grad: for neuron ${D.neuron} reading this 7, ${D.blame_z10.toFixed(4)}, times the squash slope ${D.squash_slope10} already in it, times the pixel ${D.x21} gives its weight’s slope ${D.slope_w21.toFixed(4)}. A program that performs the backward pass for any forward computation is automatic differentiation, autograd. Every library has one; Part 2 writes one by hand.`,
      line: `backward pass, backpropagation · chain rule · .grad · autograd` },
    { dur: 19, title: 'The step', box: S6, yaw: 0.08,
      text: `Pill 11’s rule, new = old − ${D.lr} × slope, is gradient descent. Taking the slope on a mini-batch, ${D.batch} pictures instead of all ${n(D.n_train)}, makes it stochastic gradient descent, SGD, the default of the whole field. The ${D.lr} is the learning rate. One pass over all the training pictures is an epoch, ${D.epochs} here; one step is an iteration, ${D.steps_per_pass} per epoch, ${n(D.n_steps)} in all. The numbers chosen by hand rather than learned, learning rate, batch size, number of epochs, are hyperparameters. A library’s optimizer is this rule, packaged, often with refinements.`,
      line: `gradient descent · SGD, mini-batch · learning rate · epoch · iteration · hyperparameters` },
    { dur: 16, title: 'One picture, all the names', box: S7, yaw: 0,
      text: `A model of ${n(D.n_knobs)} parameters in layers; a forward pass to logits and softmax; a loss against the label; a gradient by backpropagation; a step of gradient descent at a learning rate, over mini-batches, for ${D.epochs} epochs. Nothing on this page is new; only the words are, and they are the words of every paper and every library. Part 2 builds the engine behind the backward pass by hand, micrograd, in about a hundred lines, and uses these names throughout.`,
      line: `Part 2: micrograd, the engine behind the backward pass` }
  ];

  // deterministic resting state at the start of step i
  function baseState(i) {
    clearAnims();
    const hot = k => k === i || i === 6;
    const tags = (k, vis) => { for (const L of G[k]) state(L, vis ? (hot(k) ? 'on' : 'dim') : ''); };
    const paint = (m, on, color) => { m.material.color.setHex(on ? color : C.dim); m.material.emissive.setHex(on ? color : C.dim); };
    pic.visible = true; pic.material.opacity = hot(0) ? 1 : 0.45; picArrow.set(1); picArrow.color(C.muted);
    nodes.forEach(col => col.forEach(m => { m.visible = true; m.scale.setScalar(1); m.material.color.copy(hot(0) || hot(1) || hot(4) ? m.userData.hot : COL.dim); m.material.emissive.set(0); }));
    knobWire.set(1); paint(knobWire, hot(0), C.knob); ring.visible = true; ring.scale.setScalar(1); paint(ring, hot(0), C.knob); tags(0, true);
    fwd.set(i >= 1 ? 1 : 0); fwd.color(hot(1) ? C.output : C.dim);
    bars.forEach(m => { m.visible = i >= 1; m.scale.x = m.userData.len; m.position.x = BX + m.userData.len / 2; paint(m, hot(1), m.userData.hot); });
    for (const L of [...digitLabs, pctTop, pctRight]) state(L, i >= 1 ? (hot(1) ? 'on' : 'dim') : ''); tags(1, i >= 1);
    PL.show(i >= 2 ? 1 : 0); if (PL.g.visible) state(PL.xName, hot(2) ? 'on' : 'dim'); bowl.visible = i >= 2; drawTo(bowl, 1); bowl.material.color.setHex(hot(2) ? C.bad : C.dim);
    bowlDot.visible = i >= 2; bowlDot.scale.setScalar(1); paint(bowlDot, hot(2), C.knob); tags(2, i >= 2);
    field.forEach(m => { m.visible = i >= 3; m.material.opacity = hot(3) ? 1 : 0.45; }); tags(3, i >= 3);
    bwd.set(i >= 4 ? 1 : 0); bwd.color(hot(4) ? C.bad : C.dim); tags(4, i >= 4);
    tags(5, i >= 5); tags(6, i >= 6);
  }

  const enter = [
    () => { pic.visible = false; picArrow.set(0); nodes.forEach(col => col.forEach(m => { m.visible = false; })); wires.visible = false; knobWire.set(0); ring.visible = false; for (const L of G[0]) state(L, '');
      fadeIn(pic, 0.8, 0.4); on(N1.pic, 0.9); grow(picArrow, 0.8, 1.2);
      nodes.forEach((col, l) => col.forEach((m, k) => pop(m, 0.5, 1.8 + 0.8 * l + 0.4 * k / col.length)));
      later(() => { wires.visible = true; }, 2.4); anim(t => { wires.material.opacity = 0.16 * t; }, 1.6, 2.4);
      on(N1.inL, 2.4); on(N1.hidL, 3.4); on(N1.outL, 4.6); on(N1.neuron, 5.6); later(() => pulse(n10, 0.8, 0), 5.6);
      grow(knobWire, 0.6, 7.4); on(N1.weight, 7.8); later(() => { ring.visible = true; pop(ring, 0.5, 0); }, 9.6); on(N1.bias, 9.9); on(N1.params, 11.6); on(N1.model, 14.0); },
    () => { fwd.set(0); bars.forEach(m => { m.visible = false; }); for (const L of [...digitLabs, pctTop, pctRight, ...G[1]]) state(L, '');
      grow(fwd, 1.2, 0.5); on(N2.fwd, 1.5); on(N2.pre, 3.5); later(() => pulse(n10, 0.8, 0), 3.5); on(N2.actf, 5.2); on(N2.act, 6.8);
      later(() => { digitLabs.forEach(L => state(L, 'on')); }, 8.4); on(N2.logits, 8.6);
      bars.forEach((m, d) => { m.visible = false; anim(t => { m.visible = true; m.scale.x = Math.max(0.001, m.userData.len * t); m.position.x = BX + m.scale.x / 2; }, 0.8, 9.6 + 0.08 * d, easeInOut); });
      on(N2.softmax, 10.6); on(pctTop, 11.4); on(pctRight, 11.8); on(N2.pred, 13.0); },
    () => { PL.show(0); drawTo(bowl, 0); bowlDot.visible = false; for (const L of G[2]) state(L, '');
      on(N3.lab, 0.8); anim(a => PL.show(a), 0.8, 2.0); anim(t => drawTo(bowl, t), 2.0, 2.6, easeInOut); later(() => { bowlDot.visible = true; pulse(bowlDot, 0.8, 0); }, 4.8); on(N3.now, 5.0);
      on(N3.lossName, 6.6); on(N3.ce, 8.2); on(N3.train, 11.0); on(N3.test, 13.0); on(N3.gen, 15.0); },
    () => { field.forEach(m => { m.visible = false; }); for (const L of G[3]) state(L, '');
      fadeIn(field[0], 0.8, 0.5); on(N4.h1, 0.9); fadeIn(field[1], 0.8, 1.3); on(N4.h2, 1.7); fadeIn(field[2], 0.8, 2.1); on(N4.h3, 2.5);
      on(N4.deriv, 4.5); on(N4.partial, 6.5); on(N4.grad, 9.0); on(N4.legend, 11.0); },
    () => { bwd.set(0); for (const L of G[4]) state(L, '');
      grow(bwd, 1.2, 0.5); on(N5.backprop, 1.8); on(N5.chain, 5.0); on(N5.grad, 8.0); later(() => pulse(n10, 0.8, 0), 8.0); on(N5.autograd, 12.0); },
    () => { for (const L of G[5]) state(L, ''); on(N6.rule, 0.6); on(N6.gd, 2.5); on(N6.sgd, 5.0); on(N6.lr, 8.0); on(N6.epoch, 10.5); on(N6.iter, 13.0); on(N6.hyper, 15.5); },
    () => { state(N7.all, ''); on(N7.all, 1.5); }
  ];

  // ---------- ledger ----------
  const ledgerEl = document.getElementById('ledger');
  function renderLedger(i) {
    ledgerEl.innerHTML = '<div class="ln title">the names so far</div>';
    for (let k = 0; k <= i; k++) { if (!steps[k].line) continue; const d = document.createElement('div'); d.className = 'ln' + (k === i ? ' now' : ''); d.innerHTML = steps[k].line; ledgerEl.appendChild(d); }
  }

  // ---------- camera ----------

  K.run({ steps, enter, baseState, ledger: renderLedger });
})();
</script>
